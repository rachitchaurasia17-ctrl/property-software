<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PlotMap — Premium Highlight System (New Chandigarh reference)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/overlays.css?v=14">
<style>
/* Demo chrome only — the highlight system itself lives in overlay-engine.js
   + styles/overlays.css and is exactly what the Client Presentation uses. */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: #F3F1EB;
  color: #1C1E1B;
  -webkit-font-smoothing: antialiased;
  padding: 26px 18px 44px;
}
.page-head { max-width: 1500px; margin: 0 auto 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.page-head h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 30px; letter-spacing: -0.01em; margin: 0; }
.page-head .sub { font-size: 14px; color: #6A6E68; margin-top: 4px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.controls button {
  height: 34px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid #E1DCCF; background: #fff; color: #4A4E46;
  font: 700 12.5px 'Plus Jakarta Sans', system-ui, sans-serif;
}
.controls button.on { background: #1C1E1B; border-color: #1C1E1B; color: #fff; }
.demo-stage {
  position: relative;
  max-width: 1500px;
  margin: 0 auto;
  isolation: isolate;
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid #E1DCCF;
  box-shadow: 0 2px 4px rgba(120,90,30,.05), 0 26px 60px rgba(40,38,20,.16);
  background: #fff;
}
.demo-stage > img {
  display: block;
  width: 100%;
  height: auto;
  /* Match the client presentation's render box: overlay data for this map is
     authored against viewBox 1414×1036, so the demo uses the same frame. */
  aspect-ratio: 1414 / 1036;
  object-fit: fill;
  user-select: none;
  -webkit-user-drag: none;
}
.hint { max-width: 1500px; margin: 12px auto 0; font-size: 12.5px; color: #8A8672; }
.hint code { background: #ECE7DA; border-radius: 5px; padding: 1px 5px; }
</style>
</head>
<body>
<div class="page-head">
  <div>
    <h1>Premium Highlight System</h1>
    <div class="sub">New Chandigarh masterplan · untouched base image · every effect is a code overlay</div>
  </div>
  <div class="controls" id="groupBtns">
    <button data-g="">All</button>
    <button data-g="A">A · Connectivity</button>
    <button data-g="B">B · Residential</button>
    <button data-g="C">C · Commercial</button>
    <button data-g="D">D · Growth</button>
  </div>
</div>

<div class="demo-stage" id="stage">
  <img id="baseMap" src="/normal%20maps/new%20chandigarh%20masterplan.png" alt="New Chandigarh masterplan (untouched base map)">
</div>
<div class="hint">Click a glowing road or 3D block to select it · click empty map to clear · add <code>?overlayCapture=1</code> to capture coordinates for new maps.</div>

<script src="./datasets/overlays.js?v=11"></script>
<script src="/admin/core/overlay-store.js?v=12"></script>
<script src="./overlay-engine.js?v=13"></script>
<script src="./overlay-capture.js?v=11"></script>
<script>
(function () {
  const MAP_ID = 'masterplan-new-chandigarh-masterplan';
  const stage = document.getElementById('stage');
  const img = document.getElementById('baseMap');

  function mountNow() {
    if (!window.PlotMapOverlayEngine || !img.clientWidth) return;
    window.PlotMapOverlayEngine.mount({
      container: stage,
      mapId: MAP_ID,
      mode: 'original',
      width: img.clientWidth,
      height: img.clientHeight,
      client: true
    });
    if (window.PlotMapOverlayCapture) {
      window.PlotMapOverlayCapture.refresh({ container: stage, mapId: MAP_ID, mode: 'original' });
    }
  }

  if (img.complete && img.naturalWidth) mountNow();
  img.addEventListener('load', mountNow);
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(mountNow, 160); });

  document.getElementById('groupBtns').addEventListener('click', e => {
    const btn = e.target.closest('button[data-g]');
    if (!btn || !window.PlotMapOverlayEngine) return;
    document.querySelectorAll('#groupBtns button').forEach(b => b.classList.toggle('on', b === btn && btn.dataset.g !== ''));
    window.PlotMapOverlayEngine.setGroup(btn.dataset.g || null);
  });
})();
</script>
</body>
</html>
