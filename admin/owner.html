<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dealer Dashboard — PlotMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="/admin/core/plotmap-ds.css">
<!-- Data + platform contracts preserved exactly (device gate, RLS, CRM, foundation). -->
<script src="/config/runtime-env.js"></script>
<script src="/config/supabase-config.js"></script>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/event-tracker.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/overlay-store.js"></script>
<script src="/admin/core/saas-foundation.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/plotmap-shell.js"></script>
<script src="/app/plotmap/map-registry.js" defer></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'owner' });
</script>
<style>
  /* Owner Home — layout composed from design-system tokens (no per-page palette). */
  .oh-hero { border-radius:28px; padding:32px 34px; background:#241d0c; background-image:linear-gradient(140deg,#3a2f14 0%,#241d0c 60%,#150f04 100%); box-shadow:0 26px 60px -34px rgba(20,14,2,.95); }
  .oh-hero-eyebrow { font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:#c9a94a; }
  .oh-hero h1 { margin:8px 0 0; font-family:var(--pm-font-display); font-weight:500; font-size:40px; letter-spacing:-.02em; color:#fff8e6; }
  .oh-hero p { margin:8px 0 0; font-size:17px; color:#c9b48a; }
  .oh-hero-cta { display:inline-flex; align-items:center; gap:11px; height:62px; padding:0 26px; border-radius:16px; background:var(--pm-gold); color:#241d0c; font-size:18px; font-weight:800; text-decoration:none; box-shadow:0 16px 34px -16px rgba(244,174,20,.95); }
  .oh-hero-cta:hover { background:var(--pm-gold-deep); color:#241d0c; }
  .oh-hero-cta i { font-size:22px; }
  .oh-stat { border-radius:20px; padding:20px 22px; }
  .oh-stat .k { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
  .oh-stat .k i { font-size:16px; }
  .oh-stat .v { font-family:var(--pm-font-display); font-weight:500; font-size:52px; line-height:1; margin-top:6px; }
  .oh-card { min-width:0; border-radius:24px; padding:24px 26px; }
  .oh-card h3 { margin:0; font-family:var(--pm-font-display); font-weight:500; font-size:23px; color:var(--pm-ink); }
  .oh-att { text-align:left; display:flex; flex-direction:column; overflow:hidden; border-radius:18px; background:var(--pm-surface); border:1.5px solid var(--pm-hairline-2); box-shadow:var(--pm-shadow-card); transition:transform var(--pm-hover-ms) var(--pm-ease); }
  .oh-att:hover { transform:translateY(-3px); }
  .oh-photo { position:relative; aspect-ratio:4/3; background:#efe8fb; overflow:hidden; }
  .oh-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .oh-drawer { margin-top:26px; border:1.5px solid var(--pm-hairline-2); border-radius:22px; background:var(--pm-surface); overflow:hidden; }
  .oh-drawer > summary { list-style:none; cursor:pointer; padding:18px 24px; font-size:16px; font-weight:800; color:var(--pm-ink); display:flex; align-items:center; gap:10px; }
  .oh-drawer > summary::-webkit-details-marker { display:none; }
  .oh-drawer > summary .sub { font-weight:600; color:var(--pm-ink-soft); font-size:13px; }
  .oh-drawer[open] > summary { border-bottom:1px solid var(--pm-hairline); }
  .oh-drawer-body { padding:22px 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; align-items:start; }
  @media (max-width:900px){ .oh-hero h1{font-size:32px} .oh-stat .v{font-size:42px} }
</style>
</head>
<body class="pm-body pm-app-bg">
<script>
document.addEventListener('DOMContentLoaded', () => {
  const crm = window.CRM;
  const data = crm && (crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM ? crm.getCRM() : {}) || {};
  const stats = (crm && crm.computePresentationStats) ? crm.computePresentationStats() : { perArea:{}, perProperty:{} };
  const events = Array.isArray(data.presentationEvents) ? data.presentationEvents : [];
  const props = (data.properties || []).filter(p => p && p.internalStatus !== 'Archived');
  const esc = window.PMShell.esc;

  // --- Shared shell (owner variant, Home active) --------------------------------
  const mount = window.PMShell.mount({ variant:'owner', active:'home', section:{ icon:'ph-house', name:'Home' } });

  // --- Real demand-signal computations (only genuine signals) -------------------
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const ident = (window.PMFoundation && PMFoundation.getDealerSettings) ? PMFoundation.getDealerSettings() : {};
  const ownerFirst = String(ident.ownerName || ident.contactName || 'there').trim().split(/\s+/)[0] || 'there';

  const perProp = stats.perProperty || {};
  const propById = Object.fromEntries(props.map(p => [p.id, p]));
  const totalOpens = Object.values(perProp).reduce((n, v) => n + (v.views || 0), 0);

  // Share-link opens — real events only; 0 when none recorded.
  let linkOpens = 0, linkCount = 0;
  try {
    const links = (window.PMFoundation && PMFoundation.listShareLinks) ? PMFoundation.listShareLinks() : [];
    linkCount = links.length;
    linkOpens = links.reduce((n, l) => n + (l.opens || (l.events && l.events.opens) || 0), 0);
  } catch (e) {}

  // Areas (exclude synthetic masterplan-/sector- keys)
  const areaRows = Object.keys(stats.perArea || {})
    .filter(name => !/^(masterplan|sector)-/.test(name))
    .map(name => { const a = stats.perArea[name]; return { name, opens:(a.mapOpens||0)+(a.views||0), views:a.views||0, sessions:a.sessions||0 }; })
    .filter(a => a.opens > 0)
    .sort((a, b) => b.opens - a.opens);
  const hot = areaRows[0] || null;

  const num = n => Number(n || 0).toLocaleString('en-IN');
  const money = n => { n = Number(n||0); if(!n) return '—'; if(n>=1e7) return '₹'+(n/1e7).toFixed(n%1e7?1:0)+' Cr'; if(n>=1e5) return '₹'+(n/1e5).toFixed(n%1e5?1:0)+' L'; return '₹'+n.toLocaleString('en-IN'); };

  // ---- Hero + three real stat tiles ----
  // Charts need genuinely chartable signal (area opens / property views); events
  // alone (e.g. a bare presentation_opened) must not trigger empty charts.
  const hasChartData = totalOpens > 0 || areaRows.length > 0;
  mount.innerHTML = `
  <div class="pm-shell-page" style="max-width:1120px">
    <div class="oh-hero pm-anim-rise">
      <div class="pm-spread" style="align-items:flex-start;flex-wrap:wrap">
        <div>
          <div class="oh-hero-eyebrow">${esc(window.PMShell.dateStr())}</div>
          <h1>${esc(greeting)}, ${esc(ownerFirst)}.</h1>
          <p>Only from your own presentations and the links you sent.</p>
        </div>
        <a class="oh-hero-cta" href="/app/plotmap/" target="_blank" rel="noopener"><i class="ph-fill ph-projector-screen-chart"></i>Show the map</a>
      </div>
      <div class="pm-grid pm-grid-3" style="margin-top:26px">
        <div class="oh-stat" style="background:#ffc93c;background-image:linear-gradient(140deg,#ffdc7a,#f4ae14)">
          <div class="k" style="color:#8a6a14"><i class="ph-fill ph-cursor-click"></i>Opened while presenting</div>
          <div class="v" style="color:#241d0c">${num(totalOpens)}</div>
        </div>
        <div class="oh-stat" style="background:#6b3fd4;background-image:linear-gradient(140deg,#8a63e8,#5b32c4)">
          <div class="k" style="color:#d8c8ff"><i class="ph-fill ph-paper-plane-tilt"></i>Link opens</div>
          <div class="v" style="color:#fff">${num(linkOpens)}</div>
          <div style="font-size:13px;font-weight:700;color:#d8c8ff;margin-top:4px">${linkCount ? num(linkCount)+' link'+(linkCount===1?'':'s')+' sent' : 'No links sent yet'}</div>
        </div>
        <div class="oh-stat" style="background:#12a150;background-image:linear-gradient(140deg,#2ec06b,#0b8f45)">
          <div class="k" style="color:#c9f0d9"><i class="ph-fill ph-fire"></i>Hottest area</div>
          <div class="v" style="font-size:27px;font-weight:600;color:#fff;margin-top:12px;line-height:1.15">${hot ? esc(hot.name) : '—'}</div>
          <div style="font-size:14px;font-weight:700;color:#c9f0d9;margin-top:3px">${hot ? num(hot.opens)+' opens · '+num(hot.views)+' views' : 'No activity yet'}</div>
        </div>
      </div>
    </div>

    ${hasChartData ? `
    <div class="pm-grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:18px">
      <div class="oh-card pm-card-gold" id="oh-donut"></div>
      <div class="oh-card pm-card-violet" id="oh-types"></div>
    </div>
    <div class="oh-card pm-card-alt" id="oh-vs" style="border:1.5px solid var(--pm-hairline-2);margin-top:16px"></div>
    <div id="oh-verdict" style="margin-top:18px"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px">
      <div class="pm-eyebrow" style="color:var(--pm-ink-soft)">Plots pulling the most attention</div>
      <span class="pm-badge pm-badge-gold">From your presentations</span>
    </div>
    <div class="pm-grid" style="grid-template-columns:repeat(auto-fit,minmax(168px,1fr))" id="oh-attention"></div>
    ` : `
    <div class="pm-empty" style="margin-top:26px">
      <div class="pm-empty-ic"><i class="ph ph-chart-line-up"></i></div>
      <h3>No client activity yet</h3>
      <p>Open Client Presentation and walk a buyer through the map — the plots and areas they look at appear here, drawn only from your own presentations and the links you send.</p>
      <a class="pm-btn pm-btn-primary" href="/app/plotmap/" target="_blank" rel="noopener" style="margin-top:8px"><i class="ph-fill ph-projector-screen-chart"></i>Open Client Presentation</a>
    </div>
    `}

    <details class="oh-drawer" id="account-settings-drawer">
      <summary><i class="ph ph-gear-six" style="font-size:19px;color:var(--pm-ink-soft)"></i>Account &amp; business settings <span class="sub">— branding, plan, billing, client links, backup (owner only)</span></summary>
      <div class="oh-drawer-body" id="oh-settings"></div>
    </details>
  </div>`;

  // ---- Donut: where buyers look (top 6 areas + Other) ----
  if (hasChartData) (function renderDonut() {
    const el = document.getElementById('oh-donut'); if (!el) return;
    const top = areaRows.slice(0, 6);
    const otherTotal = areaRows.slice(6).reduce((n, a) => n + a.opens, 0);
    const segsData = top.map(a => ({ name:a.name, opens:a.opens })).concat(otherTotal ? [{ name:'Other areas', opens:otherTotal }] : []);
    if (!segsData.length) { el.innerHTML = '<h3>Where buyers look</h3><p class="pm-meta" style="margin-top:12px">Area interest appears here as buyers open areas during a presentation.</p>'; return; }
    const total = segsData.reduce((n, s) => n + s.opens, 0) || 1;
    const palette = ['#f4ae14','#6b3fd4','#12a150','#e0724a','#3e8ab8','#c85a1a','#b0a08a'];
    const C = 2 * Math.PI * 62; let acc = 0;
    const segs = segsData.map((s, i) => {
      const frac = s.opens / total; const dash = frac * C; const off = -acc * C; acc += frac;
      return `<circle cx="90" cy="90" r="62" fill="none" stroke="${palette[i%palette.length]}" stroke-width="34" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"></circle>`;
    }).join('');
    const topPct = Math.round((segsData[0].opens / total) * 100);
    const legend = segsData.map((s, i) => `
      <button class="pm-row" style="width:100%;padding:5px 7px;border-radius:10px" onclick="location.href='/admin/properties.html'">
        <span style="width:11px;height:11px;border-radius:4px;flex:none;background:${palette[i%palette.length]}"></span>
        <span style="flex:1;min-width:0;text-align:left;font-size:15px;font-weight:800;color:var(--pm-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</span>
        <span style="font-family:var(--pm-font-display);font-size:18px;font-weight:600;color:var(--pm-ink);flex:none">${Math.round((s.opens/total)*100)}%</span>
      </button>`).join('');
    el.innerHTML = `
      <div class="pm-spread" style="align-items:baseline"><h3>Where buyers look</h3><span style="font-size:12.5px;font-weight:800;color:#8a6a14">${num(totalOpens)} opens</span></div>
      <div class="pm-row" style="gap:18px;margin-top:16px;flex-wrap:wrap">
        <div style="position:relative;width:158px;height:158px;flex:none">
          <svg viewBox="0 0 180 180" style="width:158px;height:158px;transform:rotate(-90deg);filter:drop-shadow(0 10px 20px rgba(31,26,18,.2))">${segs}</svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
            <div style="font-family:var(--pm-font-display);font-weight:600;font-size:30px;line-height:1;color:var(--pm-ink)">${topPct}%</div>
            <div style="font-size:11.5px;font-weight:800;color:#8a6a14;text-align:center;max-width:96px;line-height:1.25;margin-top:3px">${esc(segsData[0].name)}</div>
          </div>
        </div>
        <div style="flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:6px">${legend}</div>
      </div>`;
  })();

  // ---- Type bars: what gets opened most, by property type ----
  if (hasChartData) (function renderTypes() {
    const el = document.getElementById('oh-types'); if (!el) return;
    const byType = {};
    Object.keys(perProp).forEach(id => { const p = propById[id]; const t = (p && (p.want || p.type)) || 'Other'; byType[t] = (byType[t] || 0) + (perProp[id].views || 0); });
    const rows = Object.keys(byType).map(t => ({ t, v: byType[t] })).filter(r => r.v > 0).sort((a, b) => b.v - a.v).slice(0, 5);
    const max = rows.length ? rows[0].v : 1;
    el.innerHTML = `
      <div class="pm-spread" style="align-items:baseline"><h3>What gets opened most</h3><span style="font-size:12.5px;font-weight:800;color:var(--pm-violet)">by type</span></div>
      <div style="display:flex;flex-direction:column;gap:11px;margin-top:16px">
        ${rows.length ? rows.map(r => `
          <div>
            <div class="pm-spread" style="align-items:baseline"><span style="font-size:15.5px;font-weight:800;color:var(--pm-ink)">${esc(r.t)}</span></div>
            <div class="pm-row" style="gap:9px;margin-top:6px">
              <div style="flex:1;min-width:70px;height:16px;border-radius:999px;background:#ded0fa;overflow:hidden"><div class="pm-bar-grow" style="height:100%;width:${Math.round((r.v/max)*100)}%;background:linear-gradient(90deg,#8a63e8,#5b32c4);border-radius:999px"></div></div>
              <span style="font-family:var(--pm-font-display);font-size:20px;font-weight:600;color:var(--pm-violet);flex:none">${num(r.v)}</span>
            </div>
          </div>`).join('') : '<p class="pm-meta">No property opens recorded yet.</p>'}
      </div>`;
  })();

  // ---- Interest vs stock (opens vs plots you hold), per city ----
  if (hasChartData) (function renderVs() {
    const el = document.getElementById('oh-vs'); if (!el) return;
    const stockByCity = {};
    props.forEach(p => { const c = p.city || p.area; if (c) stockByCity[c] = (stockByCity[c] || 0) + 1; });
    const cols = areaRows.slice(0, 6).map(a => ({ city:a.name, opens:a.opens, stock: stockByCity[a.name] || 0 }));
    const maxOpens = Math.max(1, ...cols.map(c => c.opens));
    const maxStock = Math.max(1, ...cols.map(c => c.stock));
    el.innerHTML = `
      <div class="pm-spread" style="align-items:baseline;flex-wrap:wrap;gap:12px">
        <div style="min-width:0"><h3>Interest on the map vs plots you hold</h3><p style="margin:4px 0 0;font-size:14px;color:var(--pm-ink-soft)">Opens are counted while you present. Nothing here comes from outside.</p></div>
        <div class="pm-row" style="gap:14px">
          <span class="pm-row" style="gap:7px;font-size:13px;font-weight:800;color:var(--pm-violet)"><span style="width:12px;height:12px;border-radius:4px;background:#6b3fd4"></span>Opens</span>
          <span class="pm-row" style="gap:7px;font-size:13px;font-weight:800;color:#a8600c"><span style="width:12px;height:12px;border-radius:4px;background:var(--pm-gold)"></span>Your plots</span>
        </div>
      </div>
      <div class="pm-grid" style="grid-template-columns:repeat(auto-fit,minmax(96px,1fr));margin-top:20px;align-items:end">
        ${cols.map(c => {
          const verdict = c.opens > 0 && c.stock === 0 ? { t:'Source stock', bg:'var(--pm-gold-bed)', fg:'var(--pm-gold-ink)' }
            : c.stock > 0 && c.opens >= c.stock ? { t:'In demand', bg:'var(--pm-green-bed)', fg:'var(--pm-green)' }
            : { t:'Stock is fine', bg:'var(--pm-surface-violet)', fg:'var(--pm-ink-soft)' };
          return `<div style="min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px">
            <div style="display:flex;align-items:flex-end;gap:6px;height:150px">
              <div class="pm-bar-grow" style="width:20px;background:linear-gradient(180deg,#8a63e8,#5b32c4);border-radius:7px 7px 0 0;height:${Math.round((c.opens/maxOpens)*140)+10}px;display:flex;align-items:flex-start;justify-content:center"><span style="font-size:11px;font-weight:800;color:#fff;margin-top:3px">${c.opens||''}</span></div>
              <div class="pm-bar-grow" style="width:20px;background:linear-gradient(180deg,#ffdc7a,#f4ae14);border-radius:7px 7px 0 0;height:${Math.round((c.stock/maxStock)*140)+10}px;display:flex;align-items:flex-start;justify-content:center"><span style="font-size:11px;font-weight:800;color:#3a2410;margin-top:3px">${c.stock||''}</span></div>
            </div>
            <div style="font-size:12.5px;font-weight:800;color:#4c463d;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis">${esc(c.city)}</div>
            <span class="pm-badge" style="background:${verdict.bg};color:${verdict.fg}">${verdict.t}</span>
          </div>`;
        }).join('')}
      </div>`;
  })();

  // ---- Verdict banner (derived from opens vs stock of the hottest area) ----
  if (hasChartData) (function renderVerdict() {
    const el = document.getElementById('oh-verdict'); if (!el || !hot) return;
    const stockByCity = {}; props.forEach(p => { const c = p.city || p.area; if (c) stockByCity[c] = (stockByCity[c]||0)+1; });
    const stock = stockByCity[hot.name] || 0;
    let v;
    if (stock === 0) v = { icon:'ph-fill ph-warning', bg:'var(--pm-gold-bed)', bd:'var(--pm-gold-bed-border)', fg:'var(--pm-gold-ink)', kicker:'Source stock', line:`Buyers keep opening ${hot.name} but you hold no plots there. Sourcing inventory here could convert existing interest.` };
    else if (hot.opens >= stock) v = { icon:'ph-fill ph-fire', bg:'var(--pm-green-bed)', bd:'var(--pm-green-bed-border)', fg:'var(--pm-green)', kicker:'In demand', line:`${hot.name} is your most-opened area with ${num(hot.opens)} opens across ${num(stock)} plot${stock===1?'':'s'} — strong buyer pull.` };
    else v = { icon:'ph-fill ph-check-circle', bg:'var(--pm-surface-violet)', bd:'var(--pm-hairline)', fg:'var(--pm-ink-2)', kicker:'Stock is fine', line:`${hot.name} has healthy stock for the interest it's seeing.` };
    el.innerHTML = `<div class="pm-row" style="gap:16px;background:${v.bg};border:1px solid ${v.bd};border-radius:22px;padding:22px 26px">
      <i class="${v.icon}" style="font-size:32px;color:${v.fg};flex:none"></i>
      <div><div class="pm-eyebrow" style="color:${v.fg}">${v.kicker} · ${esc(hot.name)}</div><div style="font-size:17px;color:#4c463d;line-height:1.45;margin-top:4px;max-width:820px">${esc(v.line)}</div></div>
    </div>`;
  })();

  // ---- Attention cards: top plots by real presentation opens ----
  if (hasChartData) (function renderAttention() {
    const el = document.getElementById('oh-attention'); if (!el) return;
    const top = Object.keys(perProp).map(id => ({ id, views:perProp[id].views||0, p:propById[id] }))
      .filter(x => x.views > 0 && x.p).sort((a, b) => b.views - a.views).slice(0, 5);
    if (!top.length) { el.innerHTML = '<p class="pm-meta">Property attention appears here once buyers open plots during a presentation.</p>'; return; }
    el.innerHTML = top.map((x, i) => {
      const photo = Array.isArray(x.p.photos) && x.p.photos.find(s => /^https?:\/\//i.test(String(s||'')));
      const loc = x.p.title || x.p.name || (x.p.area || 'Plot');
      return `<button class="oh-att" onclick="location.href='/admin/properties.html'">
        <span class="oh-photo">
          ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy">` : `<span style="position:absolute;inset:0;display:grid;place-items:center;color:var(--pm-violet)"><i class="ph ph-image" style="font-size:26px"></i></span>`}
          <span style="position:absolute;top:9px;left:9px;width:26px;height:26px;border-radius:9px;background:rgba(20,14,2,.72);color:#ffd75e;font-weight:800;font-size:13px;display:grid;place-items:center">${i+1}</span>
          <span style="position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(180deg,rgba(20,14,2,0),rgba(20,14,2,.86));display:flex;align-items:flex-end;justify-content:space-between;gap:6px">
            <span style="font-family:var(--pm-font-display);font-weight:600;font-size:23px;line-height:1;color:#ffd75e">${num(x.views)}</span>
            <span style="font-size:11px;font-weight:800;color:#f4e5c4;letter-spacing:.04em">OPENS</span>
          </span>
        </span>
        <span style="display:block;padding:10px 12px 4px;font-size:14.5px;font-weight:800;color:#211c17;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left">${esc(loc)}</span>
        <span class="pm-spread" style="padding:0 12px 12px"><span style="font-family:var(--pm-font-display);font-weight:600;font-size:17px;color:#c85a1a">${x.p.price ? money(x.p.price) : ''}</span><span style="width:9px;height:9px;border-radius:50%;background:${x.p.clientVisible!==false?'var(--pm-green-bright)':'#c9b48a'}" title="${x.p.clientVisible!==false?'On presentation':'Not published'}"></span></span>
      </button>`;
    }).join('');
  })();

  // ---- Preserved: Account & business settings drawer (real functionality) ----
  renderSettingsDrawer(data, esc, num);
});

// The settings/plan/billing/share-links/backup functionality is preserved from
// the pre-redesign owner dashboard — same PMFoundation calls and the same ids,
// re-skinned onto the design system.
function renderSettingsDrawer(data, esc, num) {
  const host = document.getElementById('oh-settings');
  if (!host || !window.PMFoundation) { if (host) host.innerHTML = '<p class="pm-meta">Settings module unavailable.</p>'; return; }
  const F = window.PMFoundation;
  host.innerHTML = `
    <div class="pm-card">
      <div class="pm-card-title" style="font-size:20px">Dealer settings</div>
      <p class="pm-body-sm" style="margin:4px 0 0">Branding and contact shown across the workspace and presentation.</p>
      <form id="dealer-settings-form" style="margin-top:14px;display:grid;gap:12px">
        <div class="pm-field"><label class="pm-label">Business name</label><input class="pm-input" id="dealer-brand-name" type="text" placeholder="PlotMap Realty"></div>
        <div class="pm-field"><label class="pm-label">Logo image link</label><input class="pm-input" id="dealer-logo-url" type="url" placeholder="https://…/logo.png"></div>
        <div class="pm-field"><label class="pm-label">Phone number</label><input class="pm-input" id="dealer-support-phone" type="text" placeholder="+91..."></div>
        <div class="pm-field"><label class="pm-label">WhatsApp number</label><input class="pm-input" id="dealer-whatsapp" type="text" placeholder="+91..."></div>
        <div class="pm-field"><label class="pm-label">Support email</label><input class="pm-input" id="dealer-support-email" type="email" placeholder="team@example.com"></div>
        <div class="pm-field"><label class="pm-label">Default city</label><input class="pm-input" id="dealer-default-city" type="text" placeholder="e.g. New Chandigarh"></div>
        <div class="pm-field"><label class="pm-label">Photo storage folder</label><input class="pm-input" id="dealer-photo-bucket" type="text" placeholder="property-photos"></div>
        <button class="pm-btn pm-btn-primary pm-btn-block" type="submit">Save settings</button>
        <div id="dealer-settings-sync" class="pm-meta"></div>
        <div id="dealer-settings-saved" class="pm-meta" style="color:var(--pm-green)"></div>
      </form>
    </div>
    <div class="pm-card">
      <div class="pm-card-title" style="font-size:20px">Plan &amp; billing</div>
      <p class="pm-body-sm" style="margin:4px 0 0">Your account status is enforced securely on our servers — this is your manual record.</p>
      <div id="dealer-plan-summary" style="display:grid;gap:10px;margin-top:14px"></div>
      <form id="dealer-plan-form" style="margin-top:14px;display:grid;gap:12px">
        <div class="pm-field"><label class="pm-label">Subscription status</label><select class="pm-select" id="dealer-plan-status"><option value="trial">Trial</option><option value="active">Active</option><option value="past_due">Past due</option><option value="expired">Expired</option></select></div>
        <div class="pm-field"><label class="pm-label">Trial end date</label><input class="pm-input" id="dealer-trial-end" type="date"></div>
        <button class="pm-btn pm-btn-ghost pm-btn-block" type="submit">Update plan state</button>
      </form>
    </div>
    <div class="pm-card" style="grid-column:1/-1">
      <div class="pm-spread" style="flex-wrap:wrap;gap:12px">
        <div><div class="pm-card-title" style="font-size:20px">Client share links</div><p class="pm-body-sm" style="margin:4px 0 0">Safe links that open only the public Client Presentation — no internal data, ever.</p></div>
        <div class="pm-row" style="flex-wrap:wrap;gap:10px">
          <select class="pm-select" id="share-map-select" style="width:auto;min-height:42px"><option value="">Whole presentation</option></select>
          <input class="pm-input" id="share-expiry" type="date" title="Optional expiry" style="width:auto;min-height:42px">
          <button class="pm-btn pm-btn-primary" type="button" id="share-create">Create share link</button>
        </div>
      </div>
      <div id="share-links-list" style="margin-top:14px"></div>
    </div>
    <div class="pm-card" style="grid-column:1/-1">
      <div class="pm-card-title" style="font-size:20px">Backup &amp; recovery</div>
      <p class="pm-body-sm" style="margin:4px 0 0">Export everything; imports are validated and confirmed first.</p>
      <div class="pm-row" style="gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="pm-btn pm-btn-ghost" type="button" id="dealer-export-data">Export dealer backup (JSON)</button>
        <button class="pm-btn pm-btn-ghost" type="button" id="dealer-import-data">Import dealer backup</button>
        <input id="dealer-import-file" type="file" accept="application/json" style="display:none">
      </div>
      <div id="dealer-backup-status" class="pm-meta" style="margin-top:10px"></div>
    </div>`;

  // Fill + wire (same contracts as before)
  const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v == null ? '' : v; };
  let settings = F.getDealerSettings();
  setVal('dealer-brand-name', settings.brandName); setVal('dealer-logo-url', settings.logoUrl);
  setVal('dealer-support-phone', settings.supportPhone); setVal('dealer-whatsapp', settings.whatsappNumber);
  setVal('dealer-support-email', settings.supportEmail); setVal('dealer-default-city', settings.defaultCity);
  setVal('dealer-photo-bucket', settings.photoBucket || 'property-photos');
  setVal('dealer-plan-status', settings.subscriptionStatus || 'trial');
  setVal('dealer-trial-end', settings.trialEnd ? String(settings.trialEnd).slice(0, 10) : '');

  const renderSync = () => { const el = document.getElementById('dealer-settings-sync'); if (el) el.innerHTML = settings.syncStatus === 'synced' ? '<span style="color:var(--pm-green);font-weight:700">Synced to the cloud.</span>' : '<span style="color:var(--pm-gold-ink);font-weight:700">Saved on this device — waiting to sync.</span>'; };
  renderSync();

  const fillMaps = () => { const reg = window.PM_MAP_REGISTRY; if (!reg || !Array.isArray(reg.maps)) { setTimeout(fillMaps, 400); return; }
    const opts = reg.maps.filter(m => m && m.status === 'active').map(m => `<option value="${esc(m.id)}">${esc(m.displayName || m.title || m.id)}</option>`).join('');
    const sel = document.getElementById('share-map-select'); if (sel) sel.innerHTML = '<option value="">Whole presentation</option>' + opts; };
  fillMaps();

  const renderPlan = () => { const plan = F.getPlanState(); const propsN = (data.properties||[]).filter(p=>p.internalStatus!=='Archived').length;
    document.getElementById('dealer-plan-summary').innerHTML = [
      { k:'Plan', v:plan.planCode }, { k:'State', v:plan.active ? (plan.subscriptionStatus==='trial'?'Trial active':'Active') : (plan.trialExpired?'Trial expired':plan.accountStatus), c: plan.active?'var(--pm-green)':'#b0532c' },
      { k:'Trial ends', v:plan.trialEnd ? new Date(plan.trialEnd).toLocaleDateString() : '—' }, { k:'Properties used', v:propsN+' / '+plan.maxProperties }
    ].map(r => `<div class="pm-spread" style="border-top:1px solid var(--pm-hairline);padding-top:10px;font-size:14px"><span style="color:var(--pm-ink-soft);font-weight:600">${esc(r.k)}</span><strong style="color:${r.c||'inherit'}">${esc(r.v)}</strong></div>`).join(''); };
  renderPlan();

  document.getElementById('dealer-settings-form').addEventListener('submit', (e) => { e.preventDefault();
    settings = F.saveDealerSettings({ brandName:val('dealer-brand-name'), logoUrl:val('dealer-logo-url'), supportPhone:val('dealer-support-phone'), whatsappNumber:val('dealer-whatsapp'), supportEmail:val('dealer-support-email'), defaultCity:val('dealer-default-city'), photoBucket:val('dealer-photo-bucket')||'property-photos' });
    document.getElementById('dealer-settings-saved').textContent = 'Saved. Branding updates on this device immediately.'; renderSync();
    window.PMShell.toast('Settings saved', 'ok'); });

  document.getElementById('dealer-plan-form').addEventListener('submit', (e) => { e.preventDefault();
    const t = val('dealer-trial-end'); settings = F.saveDealerSettings({ subscriptionStatus:val('dealer-plan-status'), trialEnd: t ? new Date(t+'T23:59:59').toISOString() : settings.trialEnd });
    renderPlan(); renderSync(); window.PMShell.toast('Plan updated', 'ok'); });

  const renderLinks = () => {
    const rows = F.listShareLinks(); const el = document.getElementById('share-links-list');
    if (!rows.length) { el.innerHTML = '<div class="pm-empty" style="padding:28px"><div class="pm-empty-ic"><i class="ph ph-paper-plane-tilt"></i></div><h3>No share links yet</h3><p>Create a link above and send it to a client — it opens only the public presentation.</p></div>'; return; }
    el.innerHTML = rows.slice(0, 12).map(row => { const expired = row.expiresAt && Date.parse(row.expiresAt) < Date.now();
      const st = row.status !== 'active' ? { l:'Disabled', c:'#b0532c' } : expired ? { l:'Expired', c:'var(--pm-gold-ink)' } : { l:'Active', c:'var(--pm-green)' };
      return `<div class="pm-spread" style="border-top:1px solid var(--pm-hairline);padding:11px 0;flex-wrap:wrap;gap:10px">
        <div style="flex:1;min-width:220px"><div style="font-size:14px;font-weight:700">${esc(row.label)} <span style="font-size:12px;font-weight:700;color:${st.c}">· ${st.l}</span></div>
        <div class="pm-meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px">${esc(row.url)}</div></div>
        <div class="pm-row" style="gap:8px;flex-wrap:wrap">
          <button class="pm-btn pm-btn-ghost pm-btn-sm" type="button" data-copy-share="${esc(row.id)}">Copy</button>
          <a class="pm-btn pm-btn-ghost pm-btn-sm" href="${esc(row.url)}" target="_blank" rel="noopener">Open</a>
          <button class="pm-btn pm-btn-ghost pm-btn-sm" type="button" data-toggle-share="${esc(row.id)}">${row.status==='active'?'Disable':'Enable'}</button>
        </div></div>`; }).join('');
    el.querySelectorAll('[data-copy-share]').forEach(b => b.addEventListener('click', async () => { const r = F.listShareLinks().find(x => x.id === b.getAttribute('data-copy-share')); if (r) await F.copyText(r.url).catch(()=>{}); window.PMShell.toast('Link copied', 'ok'); }));
    el.querySelectorAll('[data-toggle-share]').forEach(b => b.addEventListener('click', () => { const r = F.listShareLinks().find(x => x.id === b.getAttribute('data-toggle-share')); if (r) F.setShareLinkStatus(r.id, r.status==='active'?'disabled':'active'); renderLinks(); }));
  };
  renderLinks();

  document.getElementById('share-create').addEventListener('click', () => {
    const mapId = document.getElementById('share-map-select').value || null; const ex = document.getElementById('share-expiry').value;
    F.createShareLink({ label: mapId ? 'Map share link' : 'Client presentation', targetType:'presentation', mapId, view:'map', expiresAt: ex ? new Date(ex+'T23:59:59').toISOString() : null });
    renderLinks(); window.PMShell.toast('Share link created', 'ok'); });

  document.getElementById('dealer-export-data').addEventListener('click', () => {
    const payload = F.exportSnapshot(); const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
    a.download = 'plotmap-' + (payload.dealer && payload.dealer.slug ? payload.dealer.slug : 'dealer') + '-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    document.getElementById('dealer-backup-status').textContent = 'Backup exported ' + new Date().toLocaleString() + '.'; });
  document.getElementById('dealer-import-data').addEventListener('click', () => document.getElementById('dealer-import-file').click());
  document.getElementById('dealer-import-file').addEventListener('change', async (e) => {
    const status = document.getElementById('dealer-backup-status'); const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return; const text = await file.text(); const check = F.validateSnapshot(text);
    if (!check.ok) { status.textContent = 'Import blocked: ' + (check.errors[0] || 'invalid backup file'); return; }
    const lines = check.summary.filter(r => r.adds + r.overwrites > 0).map(r => r.collection + ': ' + r.adds + ' new, ' + r.overwrites + ' overwritten');
    const ok = await window.PMShell.confirm({ title:'Import this backup?', body: lines.join('  ·  ') + '. Existing records with the same id are overwritten. This cannot be undone.', okText:'Import', danger:true });
    if (!ok) { status.textContent = 'Import cancelled — nothing changed.'; return; }
    try { F.importSnapshot(text); status.textContent = 'Import applied. Reloading…'; setTimeout(() => location.reload(), 600); }
    catch (err) { status.textContent = 'Import failed: ' + (err.message || 'unknown error'); }
  });

  function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
}
</script>
</body>
</html>
