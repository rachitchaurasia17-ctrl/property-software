<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Client Details — PlotMap</title>
<link rel="stylesheet" href="/admin/crm-ui.css">
<script src="/config/runtime-env.js"></script>
<script src="/config/supabase-config.js"></script>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/event-tracker.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/nav.js"></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'team' });
</script>
</head>
<body class="pm-shell">

<header id="pm-topbar"></header>

<main class="pm-main">
  <div class="pm-page-header">
    <div>
      <h1>Client Details</h1>
      <div class="sub">Your client book — everyone your team is working with.</div>
    </div>
    <a class="pm-btn pm-btn-primary" href="/admin/team.html">+ Add Client</a>
  </div>

  <div class="pm-grid cols-4" style="margin-bottom:18px;" id="client-kpis"></div>

  <div class="pm-search" style="margin-bottom:14px;">
    <span class="icon">○</span>
    <input type="text" id="client-search" placeholder="Search clients by name, area, or phone…">
  </div>

  <section class="pm-card-xl">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap;">
      <div class="pm-card-h">All clients</div>
      <div class="pm-card-sub" id="client-book-count"></div>
    </div>
    <div id="client-book"></div>
  </section>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  window.PMNav.render('client-details');

  const crm = window.CRM;
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);

  // Display-only label map — never changes stored status values (pipeline logic).
  const STAGE_LABEL = { 'Not Answering': 'Follow up' };
  const stageLabel = (s) => STAGE_LABEL[s] || s || 'New';
  const STAGE_STYLE = {
    'New': { c:'#3E6E96', bg:'#E9EFF4' }, 'Warm': { c:'#B07A2B', bg:'#F6ECD8' },
    'Hot': { c:'#B0532C', bg:'#F6E2D8' }, 'Property Shared': { c:'#3E6E96', bg:'#E9EFF4' },
    'Site Visit Planned': { c:'#6B4FA0', bg:'#EDEAF2' }, 'Site Visit Done': { c:'#6B4FA0', bg:'#EDEAF2' },
    'Negotiation': { c:'#B07A2B', bg:'#F6ECD8' }, 'Closed': { c:'#1F5E47', bg:'#E7F0EB' },
    'Not Answering': { c:'#8A6224', bg:'#FBF3E4' }
  };
  const stageStyle = (s) => STAGE_STYLE[s] || { c:'var(--pm-text-sec)', bg:'#F0ECE3' };
  const AV = ['#1F5E47', '#3E6E96', '#A87C3D', '#6B4FA0', '#B0532C'];
  const initialsOf = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
  const avColor = (n) => AV[String(n || '').length % AV.length];

  const clientsData = () => {
    const s = crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM();
    return Array.isArray(s.clients) ? s.clients : [];
  };

  let q = '';

  function renderKPIs(all) {
    const active = all.filter(c => !/closed|lost/i.test(c.status || '')).length;
    const followup = all.filter(c => c.status === 'Not Answering').length;
    const week = all.filter(c => (Number(c.createdAt) || Number(c.lastActivityAt) || 0) > Date.now() - 7 * 86400000).length;
    document.getElementById('client-kpis').innerHTML = [
      { k: 'Total clients', v: all.length, c: 'var(--pm-text)' },
      { k: 'Active', v: active, c: 'var(--pm-emerald)' },
      { k: 'Need follow-up', v: followup, c: 'var(--pm-gold)' },
      { k: 'New this week', v: week, c: 'var(--pm-blue)' }
    ].map(s => `<div class="pm-stat-card"><div class="stat-label"><span>${s.k}</span></div><div class="stat-val" style="color:${s.c};">${s.v}</div></div>`).join('');
  }

  function clientRow(c) {
    const st = stageStyle(c.status);
    const line = [c.interestedArea, c.propertyType, c.sizeRequirement, c.budgetRange].filter(Boolean).join(' · ');
    const sub = [c.phone, c.leadSource ? 'via ' + c.leadSource : ''].filter(Boolean).join(' · ');
    return `<div style="display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-top:1px solid var(--pm-border-subtle);">
      <div style="flex:none;width:42px;height:42px;border-radius:12px;background:${avColor(c.name)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">${esc(initialsOf(c.name))}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:15px;font-weight:700;">${esc(c.name || 'Unknown')}</div>
        <div style="font-size:12.5px;color:var(--pm-text-mut);margin-top:2px;">${esc(line || '—')}</div>
        ${sub ? `<div style="font-size:12px;color:var(--pm-text-mut);margin-top:2px;">${esc(sub)}</div>` : ''}
        ${c.notes ? `<div style="font-size:12px;color:var(--pm-text-sec);margin-top:5px;">${esc(c.notes)}</div>` : ''}
      </div>
      <span class="pm-chip" style="white-space:nowrap;color:${st.c};background:${st.bg};font-weight:700;">${esc(stageLabel(c.status))}</span>
    </div>`;
  }

  function render() {
    const all = clientsData();
    renderKPIs(all);
    const list = q
      ? all.filter(c => (String(c.name || '') + ' ' + String(c.interestedArea || '') + ' ' + String(c.phone || '')).toLowerCase().includes(q))
      : all;
    const sorted = [...list].sort((a, b) => (Number(b.lastActivityAt) || 0) - (Number(a.lastActivityAt) || 0));
    document.getElementById('client-book-count').textContent = all.length
      ? (q ? sorted.length + ' of ' + all.length : all.length + ' client' + (all.length === 1 ? '' : 's'))
      : '';
    const el = document.getElementById('client-book');
    if (!all.length) {
      el.innerHTML = '<div class="pm-empty"><div class="title">No clients yet</div><div class="desc">Add your first client in the Team Workspace — they show up here for the whole team.</div><a class="pm-btn pm-btn-primary" style="margin-top:14px;" href="/admin/team.html">+ Add Client</a></div>';
      return;
    }
    if (!sorted.length) {
      el.innerHTML = '<div class="pm-empty"><div class="title">No clients match</div><div class="desc">Try a different name, area, or phone number.</div></div>';
      return;
    }
    el.innerHTML = sorted.map(clientRow).join('');
  }

  document.getElementById('client-search').addEventListener('input', (e) => { q = e.target.value.toLowerCase().trim(); render(); });
  render();
});
</script>
</body>
</html>
