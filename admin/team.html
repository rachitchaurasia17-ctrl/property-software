<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team Workspace — PlotMap</title>
<link rel="stylesheet" href="/admin/crm-ui.css">
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/saas-foundation.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/nav.js"></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'team' });
</script>
</head>
<body class="pm-shell">

<header id="pm-topbar"></header>

<main class="pm-main">
  <div class="pm-page-header">
    <div>
      <h1 id="greeting">Welcome.</h1>
      <div class="sub" id="date-line">Your daily workspace.</div>
    </div>
    <a class="pm-btn pm-btn-primary" href="/app/plotmap/">Open Client Presentation</a>
  </div>

  <!-- Today's presentation activity -->
  <div class="pm-grid cols-3" style="margin-bottom:20px;" id="stat-cards"></div>

  <!-- Quick Actions -->
  <div style="margin-bottom:18px;">
    <div style="font-size:20px;font-weight:800;margin-bottom:14px;">Quick actions</div>
    <div class="pm-grid cols-3">
      <a href="/admin/properties.html" class="pm-action-card">
        <div class="ic" style="background:#F3EAD8;color:var(--pm-gold);">+</div>
        <div class="txt">Add Property</div>
      </a>
      <a href="/admin/map-studio.html" class="pm-action-card">
        <div class="ic" style="background:#EDEAF2;color:var(--pm-purple);">◈</div>
        <div class="txt">Map Studio</div>
      </a>
      <a href="/admin/clients.html" class="pm-action-card">
        <div class="ic" style="background:#E7F0EB;color:var(--pm-emerald);">▶</div>
        <div class="txt">Client Movement</div>
      </a>
    </div>
  </div>

  <div class="pm-card-xl" style="margin-bottom:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;">
      <div>
        <div class="pm-card-h">Team access</div>
        <div class="pm-card-sub">Permissions scaffold and seat visibility for the current dealer</div>
      </div>
      <button class="pm-btn pm-btn-secondary" type="button" id="team-add-member">Add team member</button>
    </div>
    <div id="team-members-list"></div>
    <form class="pm-form" id="team-member-form" style="display:none;margin-top:16px;">
      <input type="hidden" id="team-member-id" value="">
      <div class="pm-grid cols-3">
        <div class="fld"><label>Name</label><input id="team-member-name" type="text" placeholder="Team Member"></div>
        <div class="fld"><label>Email</label><input id="team-member-email" type="email" placeholder="member@example.com"></div>
        <div class="fld"><label>Status</label><select id="team-member-status"><option value="active">Active</option><option value="blocked">Blocked</option><option value="removed">Removed</option></select></div>
      </div>
      <div class="fld" style="margin-top:12px;">
        <label>Permissions</label>
        <div id="team-permission-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="pm-btn pm-btn-primary" type="submit">Save member</button>
        <button class="pm-btn pm-btn-secondary" type="button" id="team-member-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Recent client movement -->
  <div class="pm-card-xl">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <div>
        <div class="pm-card-h">Recent client movement</div>
        <div class="pm-card-sub">Latest Client Presentation events</div>
      </div>
      <a href="/admin/clients.html" class="pm-btn-ghost">View all →</a>
    </div>
    <div id="activity-feed"></div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  window.PMNav.render('dashboard');

  const crm = window.CRM;
  const data = crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM();
  const events = Array.isArray(data.presentationEvents) ? data.presentationEvents : [];
  const propById = Object.fromEntries((data.properties || []).map(p => [p.id, p]));

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);

  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = greet + '.';
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  document.getElementById('date-line').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' — your daily workspace.';

  // Today's activity from Client Presentation events only
  const todayStr = now.toISOString().slice(0, 10);
  const todayEvents = events.filter(e => String(e.createdAt || '').slice(0, 10) === todayStr);
  const todaySessions = new Set(todayEvents.map(e => e.sessionId).filter(Boolean)).size;
  const todayViews = todayEvents.filter(e => ['property_viewed', 'property_selected', 'client_panel_opened'].includes(e.eventType)).length;
  const availableProps = (data.properties || []).filter(p => p.internalStatus === 'Available').length;

  document.getElementById('stat-cards').innerHTML = [
    { k: 'Client sessions today', v: todaySessions, c: 'var(--pm-emerald)' },
    { k: 'Property views today', v: todayViews, c: 'var(--pm-gold)' },
    { k: 'Available properties', v: availableProps, c: 'var(--pm-blue)' }
  ].map(s => `
    <div style="background:#fff;border:1px solid var(--pm-border);border-radius:22px;padding:24px 26px;box-shadow:0 1px 2px rgba(20,18,12,.03), 0 12px 26px rgba(40,32,15,.04);">
      <div style="font-size:14px;color:var(--pm-text-sec);font-weight:600;">${s.k}</div>
      <div class="pm-serif" style="font-size:46px;font-weight:500;letter-spacing:-0.01em;margin-top:12px;line-height:1;color:${s.c};">${s.v}</div>
    </div>
  `).join('');

  // Activity feed — presentation events only
  const EVENT_LABELS = {
    presentation_opened: 'Presentation opened',
    map_opened: 'Map opened',
    area_viewed: 'Area viewed',
    sector_viewed: 'Sector viewed',
    property_viewed: 'Property viewed',
    property_selected: 'Property opened',
    client_panel_opened: 'Property details opened',
    overlay_selected: 'Map overlay clicked',
    inventory_opened: 'Inventory opened',
    property_shared_whatsapp: 'Property shared on WhatsApp'
  };
  const feedEl = document.getElementById('activity-feed');
  const recent = [...events]
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
    .slice(0, 6);
  if (recent.length === 0) {
    feedEl.innerHTML = '<div class="pm-empty"><div class="title">No client activity yet</div><div class="desc">No client activity yet. Open Client Presentation to start tracking.</div></div>';
  } else {
    feedEl.innerHTML = recent.map(e => {
      const prop = e.propertyId && propById[e.propertyId];
      const detail = [prop ? (prop.title || prop.name) : null, e.area || null].filter(Boolean).join(' · ');
      return `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--pm-border-subtle);">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--pm-emerald);margin-top:6px;flex:none;"></div>
        <div>
          <div style="font-size:14px;font-weight:700;">${esc(EVENT_LABELS[e.eventType] || e.eventType)}</div>
          <div style="font-size:12px;color:var(--pm-text-mut);">${esc(detail || 'Client Presentation')}</div>
        </div>
      </div>`;
    }).join('');
  }

  if (window.PMFoundation) {
    const permGrid = document.getElementById('team-permission-grid');
    const permCatalog = window.PMFoundation.permissionCatalog();
    permGrid.innerHTML = permCatalog.map(item => `
      <label style="display:inline-flex;align-items:center;gap:8px;border:1px solid var(--pm-border);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;background:#fff;">
        <input type="checkbox" value="${esc(item.id)}">
        ${esc(item.label)}
      </label>
    `).join('');

    const form = document.getElementById('team-member-form');
    const toggleForm = (member) => {
      document.getElementById('team-member-id').value = member ? member.id : '';
      document.getElementById('team-member-name').value = member ? (member.name || '') : '';
      document.getElementById('team-member-email').value = member ? (member.email || '') : '';
      document.getElementById('team-member-status').value = member ? (member.status || 'active') : 'active';
      const selected = new Set(member ? (member.permissions || []) : window.PMFoundation.defaultPermissions('team'));
      permGrid.querySelectorAll('input[type="checkbox"]').forEach(box => {
        box.checked = selected.has(box.value);
      });
      form.style.display = 'block';
    };

    const renderMembers = () => {
      const list = window.PMFoundation.listTeamMembers();
      document.getElementById('team-members-list').innerHTML = list.length ? list.map(member => `
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--pm-border-subtle);">
          <div style="min-width:0;">
            <div style="font-size:14.5px;font-weight:700;">${esc(member.name || member.email || member.id)}</div>
            <div style="font-size:12px;color:var(--pm-text-mut);">${esc(member.role)} · ${esc(member.status || 'active')}</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
              ${(member.permissions || []).slice(0, 5).map(scope => `<span class="pm-chip" style="padding:6px 10px;">${esc(scope)}</span>`).join('')}
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            ${member.role === 'team' ? `<button class="pm-btn pm-btn-secondary sm" type="button" data-edit-member="${esc(member.id)}">Edit</button>` : ''}
            ${member.role === 'team' && member.status !== 'removed' ? `<button class="pm-btn pm-btn-secondary sm" type="button" data-remove-member="${esc(member.id)}">Remove</button>` : ''}
          </div>
        </div>
      `).join('') : '<div class="pm-empty"><div class="title">No team members yet</div><div class="desc">Use the access scaffold here to add the first team member.</div></div>';
      document.querySelectorAll('[data-edit-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const member = window.PMFoundation.listTeamMembers().find(item => item.id === btn.getAttribute('data-edit-member'));
          toggleForm(member);
        });
      });
      document.querySelectorAll('[data-remove-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          window.PMFoundation.setTeamMemberStatus(btn.getAttribute('data-remove-member'), 'removed');
          renderMembers();
        });
      });
    };

    document.getElementById('team-add-member').addEventListener('click', () => toggleForm(null));
    document.getElementById('team-member-cancel').addEventListener('click', () => { form.style.display = 'none'; });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const permissions = [...permGrid.querySelectorAll('input[type="checkbox"]:checked')].map(box => box.value);
      window.PMFoundation.saveTeamMember({
        id: document.getElementById('team-member-id').value || null,
        name: document.getElementById('team-member-name').value.trim(),
        email: document.getElementById('team-member-email').value.trim(),
        status: document.getElementById('team-member-status').value,
        role: 'team',
        permissions
      });
      form.style.display = 'none';
      renderMembers();
    });
    renderMembers();
  }
});
</script>
</body>
</html>
