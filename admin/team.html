<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team Workspace — PlotMap</title>
<link rel="stylesheet" href="/admin/crm-ui.css">
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/nav.js"></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'team' });
</script>
</head>
<body class="pm-shell">

<header id="pm-topbar"></header>

<main class="pm-main">
  <div class="pm-page-header">
    <div>
      <h1 id="greeting">Welcome.</h1>
      <div class="sub" id="date-line">Your daily workspace.</div>
    </div>
    <a class="pm-btn pm-btn-primary" href="/app/plotmap/">Open Client Presentation</a>
  </div>

  <!-- Today's presentation activity -->
  <div class="pm-grid cols-3" style="margin-bottom:20px;" id="stat-cards"></div>

  <!-- Quick Actions -->
  <div style="margin-bottom:18px;">
    <div style="font-size:20px;font-weight:800;margin-bottom:14px;">Quick actions</div>
    <div class="pm-grid cols-3">
      <a href="/admin/properties.html" class="pm-action-card">
        <div class="ic" style="background:#F3EAD8;color:var(--pm-gold);">+</div>
        <div class="txt">Add Property</div>
      </a>
      <a href="/admin/map-studio.html" class="pm-action-card">
        <div class="ic" style="background:#EDEAF2;color:var(--pm-purple);">◈</div>
        <div class="txt">Map Studio</div>
      </a>
      <a href="/admin/clients.html" class="pm-action-card">
        <div class="ic" style="background:#E7F0EB;color:var(--pm-emerald);">▶</div>
        <div class="txt">Client Movement</div>
      </a>
    </div>
  </div>

  <!-- Recent client movement -->
  <div class="pm-card-xl">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <div>
        <div class="pm-card-h">Recent client movement</div>
        <div class="pm-card-sub">Latest Client Presentation events</div>
      </div>
      <a href="/admin/clients.html" class="pm-btn-ghost">View all →</a>
    </div>
    <div id="activity-feed"></div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  window.PMNav.render('dashboard');

  const crm = window.CRM;
  const data = crm.getCRM();
  const events = Array.isArray(data.presentationEvents) ? data.presentationEvents : [];
  const propById = Object.fromEntries((data.properties || []).map(p => [p.id, p]));

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);

  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = greet + '.';
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  document.getElementById('date-line').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' — your daily workspace.';

  // Today's activity from Client Presentation events only
  const todayStr = now.toISOString().slice(0, 10);
  const todayEvents = events.filter(e => String(e.createdAt || '').slice(0, 10) === todayStr);
  const todaySessions = new Set(todayEvents.map(e => e.sessionId).filter(Boolean)).size;
  const todayViews = todayEvents.filter(e => ['property_viewed', 'property_selected', 'client_panel_opened'].includes(e.eventType)).length;
  const availableProps = (data.properties || []).filter(p => p.internalStatus === 'Available').length;

  document.getElementById('stat-cards').innerHTML = [
    { k: 'Client sessions today', v: todaySessions, c: 'var(--pm-emerald)' },
    { k: 'Property views today', v: todayViews, c: 'var(--pm-gold)' },
    { k: 'Available properties', v: availableProps, c: 'var(--pm-blue)' }
  ].map(s => `
    <div style="background:#fff;border:1px solid var(--pm-border);border-radius:22px;padding:24px 26px;box-shadow:0 1px 2px rgba(20,18,12,.03), 0 12px 26px rgba(40,32,15,.04);">
      <div style="font-size:14px;color:var(--pm-text-sec);font-weight:600;">${s.k}</div>
      <div class="pm-serif" style="font-size:46px;font-weight:500;letter-spacing:-0.01em;margin-top:12px;line-height:1;color:${s.c};">${s.v}</div>
    </div>
  `).join('');

  // Activity feed — presentation events only
  const EVENT_LABELS = {
    presentation_opened: 'Presentation opened',
    map_opened: 'Map opened',
    area_viewed: 'Area viewed',
    sector_viewed: 'Sector viewed',
    property_viewed: 'Property viewed',
    property_selected: 'Property opened',
    client_panel_opened: 'Property details opened',
    overlay_selected: 'Map overlay clicked',
    inventory_opened: 'Inventory opened',
    property_shared_whatsapp: 'Property shared on WhatsApp'
  };
  const feedEl = document.getElementById('activity-feed');
  const recent = [...events]
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
    .slice(0, 6);
  if (recent.length === 0) {
    feedEl.innerHTML = '<div class="pm-empty"><div class="title">No client activity yet</div><div class="desc">No client activity yet. Open Client Presentation to start tracking.</div></div>';
  } else {
    feedEl.innerHTML = recent.map(e => {
      const prop = e.propertyId && propById[e.propertyId];
      const detail = [prop ? (prop.title || prop.name) : null, e.area || null].filter(Boolean).join(' · ');
      return `<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--pm-border-subtle);">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--pm-emerald);margin-top:6px;flex:none;"></div>
        <div>
          <div style="font-size:14px;font-weight:700;">${esc(EVENT_LABELS[e.eventType] || e.eventType)}</div>
          <div style="font-size:12px;color:var(--pm-text-mut);">${esc(detail || 'Client Presentation')}</div>
        </div>
      </div>`;
    }).join('');
  }
});
</script>
</body>
</html>
