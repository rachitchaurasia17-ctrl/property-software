<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team Workspace — PlotMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="/admin/core/plotmap-ds.css">
<script src="/config/runtime-env.js"></script>
<script src="/config/supabase-config.js"></script>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/event-tracker.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/overlay-store.js"></script>
<script src="/admin/core/saas-foundation.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/plotmap-shell.js"></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'team' });
</script>
<style>
  .tw-hero { border-radius:24px; padding:28px 32px; background:#1e1a12; background-image:linear-gradient(135deg,#2c261b 0%,#1e1a12 60%,#120f09 100%); color:#fff; box-shadow:0 20px 40px -20px rgba(0,0,0,0.6); margin-bottom:28px; }
  .tw-hero h1 { font-family:var(--pm-font-display); font-weight:500; font-size:36px; color:#fff8e6; margin:6px 0 8px; }
  .tw-quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:28px; }
  .tw-quick-card { display:flex; align-items:center; gap:14px; padding:18px 20px; background:var(--pm-surface); border:1.5px solid var(--pm-hairline-2); border-radius:18px; text-decoration:none; color:var(--pm-ink); box-shadow:var(--pm-shadow-card); transition:transform var(--pm-hover-ms) ease, border-color var(--pm-hover-ms) ease; cursor:pointer; }
  .tw-quick-card:hover { transform:translateY(-2px); border-color:var(--pm-violet); }
  .tw-quick-icon { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .tw-row { display:flex; align-items:center; gap:16px; padding:16px 18px; border-bottom:1px solid var(--pm-hairline); background:var(--pm-surface); transition:background var(--pm-hover-ms); }
  .tw-row:last-child { border-bottom:none; }
  .tw-row:hover { background:var(--pm-surface-alt); }
  .tw-av { width:40px; height:40px; border-radius:12px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none; }
</style>
</head>
<body class="pm-body pm-app-bg">
<script>
document.addEventListener('DOMContentLoaded', () => {
  const crm = window.CRM;
  const esc = window.PMShell.esc;

  // Team Workspace always mounts team shell variant
  const mount = window.PMShell.mount({
    variant: 'team',
    active: 'workspace',
    section: { icon: 'ph-users-three', name: 'Team Workspace' }
  });

  // Check notice from access bounce
  try {
    const denied = new URLSearchParams(location.search).get('denied');
    if (denied) {
      window.PMShell.toast('That page is restricted to owners. Welcome to your workspace!', 'warn');
    }
  } catch (err) {}

  const scoped = () => (crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM());

  const STAGE_COLORS = {
    'New': { c: 'var(--pm-blue)', bg: 'var(--pm-surface-blue)' },
    'Warm': { c: 'var(--pm-gold-dark)', bg: 'var(--pm-surface-gold)' },
    'Hot': { c: 'var(--pm-orange)', bg: '#fdf0ea' },
    'Property Shared': { c: 'var(--pm-blue)', bg: 'var(--pm-surface-blue)' },
    'Site Visit Planned': { c: 'var(--pm-violet-deep)', bg: 'var(--pm-surface-violet)' },
    'Site Visit Done': { c: 'var(--pm-violet-deep)', bg: 'var(--pm-surface-violet)' },
    'Negotiation': { c: 'var(--pm-gold-dark)', bg: 'var(--pm-surface-gold)' },
    'Closed': { c: 'var(--pm-emerald)', bg: 'var(--pm-surface-green)' },
    'Not Answering': { c: 'var(--pm-gold-dark)', bg: 'var(--pm-surface-gold)' }
  };
  const stageStyle = (s) => STAGE_COLORS[s] || { c: 'var(--pm-ink-soft)', bg: 'var(--pm-surface-alt)' };
  const STAGE_LABEL = { 'Not Answering': 'Follow up' };
  const stageLabel = (s) => STAGE_LABEL[s] || s || 'New';
  const AV_COLORS = ['#1f5e47', '#3e6e96', '#a87c3d', '#6b4fa0', '#b0532c'];
  const initialsOf = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
  const avColor = (name) => AV_COLORS[(String(name || '').length) % AV_COLORS.length];

  let currentProfileName = 'Team Member';

  if (window.PMAuth) {
    window.PMAuth.getCurrentProfile().then(profile => {
      if (!profile) return;
      const raw = (profile.display_name || (profile.email || '').split('@')[0] || '').trim();
      if (raw) currentProfileName = raw.charAt(0).toUpperCase() + raw.slice(1);
      const greetingTitle = document.getElementById('tw-greeting-title');
      if (greetingTitle) greetingTitle.textContent = 'Welcome back, ' + currentProfileName + '.';
    }).catch(() => {});
  }

  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const now = new Date();
  const dateStr = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];

  function renderPage() {
    const data = scoped();
    const clients = Array.isArray(data.clients) ? data.clients : [];
    const canManageTeam = window.PMFoundation && window.PMFoundation.currentUserCan('team.manage');

    mount.innerHTML = `
      <!-- Hero -->
      <div class="tw-hero">
        <div style="font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--pm-gold);">${esc(dateStr)}</div>
        <h1 id="tw-greeting-title">Welcome back, ${esc(currentProfileName)}.</h1>
        <p style="font-size:16px;color:#c9b48a;margin:0 0 20px;">Your work table for today — add clients, list properties, and mark plots on the map.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button type="button" class="pm-btn pm-btn-violet" id="tw-hdr-add-client">
            <i class="ph ph-user-plus" style="font-size:18px;"></i> + Add Client
          </button>
          <a class="pm-btn pm-btn-ghost" href="/admin/properties.html" style="color:#fff;border-color:rgba(255,255,255,0.2);">
            <i class="ph ph-buildings"></i> Open Properties
          </a>
        </div>
      </div>

      <!-- Quick Action Cards -->
      <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);margin-bottom:14px;">Do Next</div>
      <div class="tw-quick-grid">
        <div class="tw-quick-card" id="tw-act-add-client">
          <div class="tw-quick-icon" style="background:var(--pm-surface-violet);color:var(--pm-violet-deep);"><i class="ph ph-user-plus"></i></div>
          <div>
            <div style="font-weight:700;font-size:15px;">Add Client</div>
            <div style="font-size:12.5px;color:var(--pm-ink-soft);">Add to your book</div>
          </div>
        </div>
        <a href="/admin/properties.html" class="tw-quick-card">
          <div class="tw-quick-icon" style="background:var(--pm-surface-gold);color:var(--pm-gold-dark);"><i class="ph ph-plus-circle"></i></div>
          <div>
            <div style="font-weight:700;font-size:15px;">Add Property</div>
            <div style="font-size:12.5px;color:var(--pm-ink-soft);">List a new plot</div>
          </div>
        </a>
        <a href="/admin/properties.html" class="tw-quick-card">
          <div class="tw-quick-icon" style="background:var(--pm-surface-blue);color:var(--pm-blue);"><i class="ph ph-buildings"></i></div>
          <div>
            <div style="font-weight:700;font-size:15px;">Open Properties</div>
            <div style="font-size:12.5px;color:var(--pm-ink-soft);">Manage inventory</div>
          </div>
        </a>
        <a href="/admin/map-studio.html" class="tw-quick-card">
          <div class="tw-quick-icon" style="background:var(--pm-surface-green);color:var(--pm-emerald);"><i class="ph ph-map-trifold"></i></div>
          <div>
            <div style="font-weight:700;font-size:15px;">Open Map Studio</div>
            <div style="font-size:12.5px;color:var(--pm-ink-soft);">Mark roads &amp; plots</div>
          </div>
        </a>
      </div>

      <!-- My Clients Card -->
      <div class="pm-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);margin-bottom:28px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;">
          <div>
            <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);">My Clients</div>
            <div style="font-size:13.5px;color:var(--pm-ink-soft);">${clients.length} in your workspace book</div>
          </div>
          <a class="pm-btn pm-btn-soft pm-btn-sm" href="/admin/clients.html">View All Clients →</a>
        </div>
        <div id="tw-clients-list" style="border:1px solid var(--pm-hairline);border-radius:16px;overflow:hidden;"></div>
      </div>

      <!-- Team Management Card (Owner/Manager Only) -->
      ${canManageTeam ? `
      <div class="pm-card" id="tw-team-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
          <div>
            <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);">Team Management</div>
            <div style="font-size:13.5px;color:var(--pm-ink-soft);">Roles, permissions, and access status for everyone on Dealer Login</div>
          </div>
          <button class="pm-btn pm-btn-violet pm-btn-sm" type="button" id="tw-add-team-btn">+ Add Team Member</button>
        </div>
        <div id="tw-team-members-list" style="border:1px solid var(--pm-hairline);border-radius:16px;overflow:hidden;margin-bottom:16px;"></div>

        <!-- Add/Edit Team Member Form (collapsible) -->
        <div id="tw-team-form-wrap" style="display:none;background:var(--pm-surface-alt);border:1px solid var(--pm-hairline-2);border-radius:18px;padding:20px;margin-top:16px;">
          <h4 id="tw-form-title" style="margin:0 0 16px;font-family:var(--pm-font-display);font-size:20px;font-weight:500;">Add Team Member</h4>
          <input type="hidden" id="tw-mem-id" value="">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px;">
            <div class="pm-field">
              <label class="pm-label">Name</label>
              <input id="tw-mem-name" class="pm-input" type="text" placeholder="Full Name">
            </div>
            <div class="pm-field">
              <label class="pm-label">Email (Login email)</label>
              <input id="tw-mem-email" class="pm-input" type="email" placeholder="member@example.com">
            </div>
            <div class="pm-field">
              <label class="pm-label">Role</label>
              <select id="tw-mem-role" class="pm-select"></select>
            </div>
            <div class="pm-field">
              <label class="pm-label">Status</label>
              <select id="tw-mem-status" class="pm-select">
                <option value="active">Active</option>
                <option value="blocked">Blocked</option>
                <option value="disabled">Disabled</option>
                <option value="removed">Removed</option>
              </select>
            </div>
          </div>
          <div class="pm-field" style="margin-bottom:12px;">
            <label class="pm-label">Permissions Scope</label>
            <div id="tw-perm-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
          </div>
          <div id="tw-allowed-pages" style="font-size:13px;color:var(--pm-ink-soft);margin-bottom:16px;"></div>
          <div id="tw-form-error" style="font-size:13px;color:var(--pm-orange);margin-bottom:12px;"></div>
          <div style="display:flex;gap:10px;">
            <button class="pm-btn pm-btn-violet" type="button" id="tw-mem-save">Save Member</button>
            <button class="pm-btn pm-btn-ghost" type="button" id="tw-mem-cancel">Cancel</button>
          </div>
        </div>
      </div>` : ''}
    `;

    renderClientsList();
    if (canManageTeam) setupTeamManagement();

    // Bind Quick Actions
    const addClientAct = document.getElementById('tw-act-add-client');
    if (addClientAct) addClientAct.addEventListener('click', () => openClientModal());

    const addClientHdr = document.getElementById('tw-hdr-add-client');
    if (addClientHdr) addClientHdr.addEventListener('click', () => openClientModal());
  }

  function renderClientsList() {
    const el = document.getElementById('tw-clients-list');
    if (!el) return;

    const data = scoped();
    const clients = Array.isArray(data.clients) ? data.clients : [];
    const sorted = [...clients].sort((a, b) => (Number(b.lastActivityAt) || Number(b.createdAt) || 0) - (Number(a.lastActivityAt) || Number(a.createdAt) || 0));

    if (!sorted.length) {
      el.innerHTML = `
        <div class="pm-empty" style="padding:32px 16px;">
          <div class="pm-empty-title">No clients yet</div>
          <div class="pm-empty-desc">Add your first client to start building your workspace book.</div>
        </div>`;
      return;
    }

    el.innerHTML = sorted.slice(0, 8).map(c => {
      const st = stageStyle(c.status);
      const meta = [c.interestedArea, c.sizeRequirement].filter(Boolean).join(' · ');
      return `
        <div class="tw-row">
          <div class="tw-av" style="background:${avColor(c.name)};">${esc(initialsOf(c.name))}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:var(--pm-ink);">${esc(c.name || 'Unknown')}</div>
            <div style="font-size:13px;color:var(--pm-ink-soft);margin-top:2px;">${esc(meta || '—')}</div>
          </div>
          <span class="pm-badge" style="color:${st.c};background:${st.bg};font-weight:700;">${esc(stageLabel(c.status))}</span>
        </div>`;
    }).join('');
  }

  function setupTeamManagement() {
    const listEl = document.getElementById('tw-team-members-list');
    const formWrap = document.getElementById('tw-team-form-wrap');
    const addBtn = document.getElementById('tw-add-team-btn');
    const roleSelect = document.getElementById('tw-mem-role');
    const permGrid = document.getElementById('tw-perm-grid');
    const allowedPagesEl = document.getElementById('tw-allowed-pages');
    if (!listEl || !window.PMFoundation) return;

    const permCatalog = window.PMFoundation.permissionCatalog();
    const ROLE_LABELS = {};

    roleSelect.innerHTML = window.PMFoundation.TEAM_ROLES.map(role => {
      ROLE_LABELS[role.id] = role.label;
      return `<option value="${esc(role.id)}">${esc(role.label)}</option>`;
    }).join('');
    ROLE_LABELS.owner = 'Owner';

    permGrid.innerHTML = permCatalog.map(item => `
      <label style="display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pm-hairline-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--pm-surface);">
        <input type="checkbox" value="${esc(item.id)}"> ${esc(item.label)}
      </label>
    `).join('');

    const PAGE_SCOPES = [
      { label: 'Client Presentation', scope: 'presentation.view' },
      { label: 'Map Studio', scope: 'mapstudio.manage' },
      { label: 'Properties', scope: 'properties.manage' },
      { label: 'Deals', scope: 'deals.view' },
      { label: 'Client Details', scope: 'clients.view' },
      { label: 'Area Intelligence', scope: 'insights.view' }
    ];

    const refreshAllowedPages = () => {
      const selected = [...permGrid.querySelectorAll('input[type="checkbox"]:checked')].map(box => box.value);
      const pages = PAGE_SCOPES.filter(p => selected.includes(p.scope)).map(p => p.label);
      allowedPagesEl.textContent = pages.length ? 'Allowed pages: Workspace, ' + pages.join(', ') : 'Allowed pages: Workspace only';
    };

    permGrid.addEventListener('change', refreshAllowedPages);
    roleSelect.addEventListener('change', () => {
      const preset = new Set(window.PMFoundation.defaultPermissions(roleSelect.value));
      permGrid.querySelectorAll('input[type="checkbox"]').forEach(box => { box.checked = preset.has(box.value); });
      refreshAllowedPages();
    });

    const renderMembers = () => {
      const list = window.PMFoundation.listTeamMembers();
      if (!list.length) {
        listEl.innerHTML = '<div class="pm-empty" style="padding:24px;"><div class="pm-empty-title">No team members added yet</div></div>';
        return;
      }
      const STATUS_COLORS = { active: 'var(--pm-emerald)', blocked: 'var(--pm-orange)', disabled: 'var(--pm-orange)', removed: 'var(--pm-ink-soft)' };

      listEl.innerHTML = list.map(m => `
        <div class="tw-row">
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:var(--pm-ink);">${esc(m.name || m.email || m.id)}</div>
            <div style="font-size:13px;color:var(--pm-ink-soft);margin-top:2px;">
              ${esc(ROLE_LABELS[m.role] || m.role)} ·
              <span style="color:${STATUS_COLORS[m.status] || 'var(--pm-ink-soft)'};font-weight:700;">${esc(m.status || 'active')}</span>
              ${m.email ? ' · ' + esc(m.email) : ''}
            </div>
          </div>
          ${m.role !== 'owner' ? `
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="pm-btn pm-btn-soft pm-btn-sm" type="button" data-edit-member="${esc(m.id)}">Edit</button>
            ${m.status === 'active' ? `<button class="pm-btn pm-btn-soft pm-btn-sm" type="button" data-disable-member="${esc(m.id)}">Disable</button>` : ''}
            ${m.status !== 'active' && m.status !== 'removed' ? `<button class="pm-btn pm-btn-soft pm-btn-sm" type="button" data-enable-member="${esc(m.id)}">Re-activate</button>` : ''}
          </div>` : ''}
        </div>
      `).join('');

      listEl.querySelectorAll('[data-edit-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = window.PMFoundation.listTeamMembers().find(x => x.id === btn.getAttribute('data-edit-member'));
          if (m) openMemberForm(m);
        });
      });
      listEl.querySelectorAll('[data-disable-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          window.PMFoundation.setTeamMemberStatus(btn.getAttribute('data-disable-member'), 'disabled');
          window.PMShell.toast('Team member disabled', 'ok');
          renderMembers();
        });
      });
      listEl.querySelectorAll('[data-enable-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          window.PMFoundation.setTeamMemberStatus(btn.getAttribute('data-enable-member'), 'active');
          window.PMShell.toast('Team member activated', 'ok');
          renderMembers();
        });
      });
    };

    const openMemberForm = (member) => {
      const isEdit = !!member;
      document.getElementById('tw-mem-id').value = isEdit ? member.id : '';
      document.getElementById('tw-mem-name').value = isEdit ? (member.name || '') : '';
      document.getElementById('tw-mem-email').value = isEdit ? (member.email || '') : '';
      document.getElementById('tw-mem-status').value = isEdit ? (member.status || 'active') : 'active';
      roleSelect.value = isEdit && member.role !== 'owner' ? (member.role || 'team') : 'team';
      const selected = new Set(isEdit ? (member.permissions || []) : window.PMFoundation.defaultPermissions(roleSelect.value));
      permGrid.querySelectorAll('input[type="checkbox"]').forEach(box => { box.checked = selected.has(box.value); });
      document.getElementById('tw-form-title').textContent = isEdit ? 'Edit Team Member' : 'Add Team Member';
      document.getElementById('tw-form-error').textContent = '';
      refreshAllowedPages();
      formWrap.style.display = 'block';
    };

    addBtn.addEventListener('click', () => openMemberForm(null));
    document.getElementById('tw-mem-cancel').addEventListener('click', () => { formWrap.style.display = 'none'; });

    document.getElementById('tw-mem-save').addEventListener('click', () => {
      const errEl = document.getElementById('tw-form-error');
      errEl.textContent = '';
      const selectedScopes = [...permGrid.querySelectorAll('input[type="checkbox"]:checked')].map(box => box.value);
      try {
        window.PMFoundation.saveTeamMember({
          id: document.getElementById('tw-mem-id').value || null,
          name: document.getElementById('tw-mem-name').value.trim(),
          email: document.getElementById('tw-mem-email').value.trim(),
          status: document.getElementById('tw-mem-status').value,
          role: roleSelect.value,
          permissions: selectedScopes
        });
        window.PMShell.toast('Team member saved', 'ok');
        formWrap.style.display = 'none';
        renderMembers();
      } catch (err) {
        errEl.textContent = err.message || 'Could not save team member.';
      }
    });

    renderMembers();
  }

  function openClientModal() {
    const overlay = document.createElement('div');
    overlay.className = 'pm-overlay is-open';
    overlay.innerHTML = `
      <div class="pm-dialog" style="max-width:520px;">
        <div class="pm-dialog-h">
          <h3>Add Client</h3>
          <button type="button" class="pm-btn-close" id="tw-cl-close"><i class="ph ph-x"></i></button>
        </div>
        <form id="tw-cl-form">
          <div class="pm-field" style="margin-bottom:14px;">
            <label class="pm-label">Full Name <span style="color:var(--pm-orange);">*</span></label>
            <input id="tw-cl-name" class="pm-input" type="text" placeholder="e.g. Rajdeep Singh" required>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
            <div class="pm-field">
              <label class="pm-label">Phone</label>
              <input id="tw-cl-phone" class="pm-input" type="text" placeholder="+91 …">
            </div>
            <div class="pm-field">
              <label class="pm-label">Budget</label>
              <input id="tw-cl-budget" class="pm-input" type="text" placeholder="₹ …">
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
            <div class="pm-field">
              <label class="pm-label">Area Interested In</label>
              <input id="tw-cl-area" class="pm-input" type="text" placeholder="e.g. Aerocity">
            </div>
            <div class="pm-field">
              <label class="pm-label">Property Type</label>
              <select id="tw-cl-ptype" class="pm-select">
                <option value="">—</option>
                <option>Residential Plot</option><option>Commercial</option><option>Commercial SCO</option>
                <option>Showroom</option><option>Residential</option><option>Other</option>
              </select>
            </div>
          </div>
          <div class="pm-field" style="margin-bottom:20px;">
            <label class="pm-label">Requirement &amp; Notes</label>
            <input id="tw-cl-notes" class="pm-input" type="text" placeholder="250 sq yd, corner plot preferred…">
          </div>
          <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button type="button" class="pm-btn pm-btn-ghost" id="tw-cl-cancel">Cancel</button>
            <button type="submit" class="pm-btn pm-btn-violet">Save Client</button>
          </div>
        </form>
      </div>`;

    document.body.appendChild(overlay);

    const close = () => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
    overlay.querySelector('#tw-cl-close').addEventListener('click', close);
    overlay.querySelector('#tw-cl-cancel').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

    overlay.querySelector('#tw-cl-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = overlay.querySelector('#tw-cl-name').value.trim();
      if (!name) return;
      crm.addClient({
        name,
        type: 'buyer',
        phone: overlay.querySelector('#tw-cl-phone').value.trim(),
        budgetRange: overlay.querySelector('#tw-cl-budget').value.trim(),
        interestedArea: overlay.querySelector('#tw-cl-area').value.trim(),
        propertyType: overlay.querySelector('#tw-cl-ptype').value,
        notes: overlay.querySelector('#tw-cl-notes').value.trim(),
        status: 'New',
        createdAt: new Date().toISOString()
      });
      window.PMShell.toast('Client added', 'ok');
      close();
      renderPage();
    });
  }

  renderPage();
});
</script>
</body>
</html>
