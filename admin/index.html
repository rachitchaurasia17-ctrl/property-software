<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PlotMap Admin Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/access-control.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { background:#0C100E; font-family:'Plus Jakarta Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:#1C1E1B; }
  button, input { font-family:inherit; }
  .pm-serif { font-family:'Fraunces',serif; }
  @media (max-width: 860px) {
    .gateway-grid { grid-template-columns:1fr !important; }
  }
  @media (max-width: 640px) {
    .gateway-wrap { padding:24px 20px 28px !important; }
  }
</style>
</head>
<body>

<div style="height:100vh; display:flex; flex-direction:column; background:#0C100E; overflow:hidden;">
  <section style="position:absolute; inset:0; overflow:auto; background:#0C100E;">
    <div style="position:absolute; inset:0; background:radial-gradient(120% 80% at 50% -10%, #15201A 0%, #0E1311 46%, #090C0A 100%);"></div>
    <div style="position:absolute; left:50%; top:-180px; transform:translateX(-50%); width:760px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(198,160,98,0.16), transparent 62%);"></div>
    <div style="position:absolute; left:0; right:0; bottom:0; height:1px; background:linear-gradient(90deg,transparent,rgba(198,160,98,.3),transparent);"></div>

    <div class="gateway-wrap" style="position:relative; min-height:100%; max-width:1080px; margin:0 auto; padding:32px 48px 40px; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex:none;">
        <div style="display:flex; align-items:center; gap:9px; color:#8A9A90; font-size:12px; letter-spacing:0.2em; font-weight:600;"><span style="width:7px; height:7px; border-radius:50%; background:#5FB58C;"></span>TRICITY · LIVE</div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11px; letter-spacing:0.16em; color:#6E7C73;">POWERED BY</span>
          <span style="width:13px; height:13px; border-radius:50%; border:2.5px solid #4F9C77;"></span>
          <span style="font-size:14px; font-weight:800; letter-spacing:-0.01em; color:#DCE6E0;">PlotMap</span>
        </div>
      </div>

      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <div style="width:72px; height:72px; border-radius:20px; border:1px solid rgba(198,160,98,.4); background:linear-gradient(155deg,#16201A,#0E1512); display:flex; align-items:center; justify-content:center; box-shadow:0 16px 44px rgba(0,0,0,.4); margin-bottom:30px;">
          <div style="width:26px; height:26px; border-radius:50%; border:3px solid #D8B576;"></div>
        </div>
        <h1 class="pm-serif" style="font-weight:500; font-size:74px; line-height:1; letter-spacing:0.04em; margin:0; color:#F4EFE6;">PlotMap</h1>
        <div class="pm-serif" style="font-weight:400; font-size:26px; letter-spacing:0.32em; margin:14px 0 0; padding-left:0.32em; color:#C9A35F;">ADMIN GATEWAY</div>
        <div style="display:flex; align-items:center; gap:14px; margin:30px 0 0;">
          <span style="height:1px; width:44px; background:linear-gradient(90deg,transparent,rgba(198,160,98,.6));"></span>
          <span style="font-size:11.5px; letter-spacing:0.24em; color:#8A9A90; font-weight:600;">SECURE WORKSPACES ONLY</span>
          <span style="height:1px; width:44px; background:linear-gradient(90deg,rgba(198,160,98,.6),transparent);"></span>
        </div>
        <p style="font-size:17.5px; line-height:1.6; color:#9FB0A6; max-width:48ch; margin:26px 0 0;">Choose how you want to continue. Client presentation stays public. Dealer and team workspaces now require a valid Supabase session.</p>
      </div>

      <div class="gateway-grid" style="flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:40px;">
        <button onclick="continueAs('presentation')" style="text-align:left; cursor:pointer; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:22px 22px 20px; display:flex; flex-direction:column; min-height:150px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(95,227,198,.6); color:#7FE8CE; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;">◑</div>
            <span class="pm-serif" style="font-size:14px; color:rgba(255,255,255,.32);">01</span>
          </div>
          <div style="font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:#7FE8CE; font-weight:700; margin-top:18px;">For your client</div>
          <div class="pm-serif" style="font-size:23px; font-weight:500; letter-spacing:-0.01em; color:#F4EFE6; margin-top:4px;">Client Presentation</div>
          <div style="display:flex; align-items:center; gap:7px; margin-top:14px; font-size:13.5px; font-weight:700; color:#7FE8CE;">Start presenting <span style="font-size:15px;">→</span></div>
        </button>

        <button onclick="continueAs('dealer')" style="text-align:left; cursor:pointer; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:22px 22px 20px; display:flex; flex-direction:column; min-height:150px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,217,160,.6); color:#FFD9A0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;">◆</div>
            <span class="pm-serif" style="font-size:14px; color:rgba(255,255,255,.32);">02</span>
          </div>
          <div style="font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:#FFD9A0; font-weight:700; margin-top:18px;">For the owner</div>
          <div class="pm-serif" style="font-size:23px; font-weight:500; letter-spacing:-0.01em; color:#F4EFE6; margin-top:4px;">Dealer Login</div>
          <div style="display:flex; align-items:center; gap:7px; margin-top:14px; font-size:13.5px; font-weight:700; color:#FFD9A0;">Enter command <span style="font-size:15px;">→</span></div>
        </button>

        <button onclick="continueAs('team')" style="text-align:left; cursor:pointer; background:rgba(255,255,255,.025); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:22px 22px 20px; display:flex; flex-direction:column; min-height:150px;">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div style="width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(168,150,255,.6); color:#C0B0FF; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800;">◐</div>
            <span class="pm-serif" style="font-size:14px; color:rgba(255,255,255,.32);">03</span>
          </div>
          <div style="font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:#C0B0FF; font-weight:700; margin-top:18px;">For your team</div>
          <div class="pm-serif" style="font-size:23px; font-weight:500; letter-spacing:-0.01em; color:#F4EFE6; margin-top:4px;">Team Login</div>
          <div style="display:flex; align-items:center; gap:7px; margin-top:14px; font-size:13.5px; font-weight:700; color:#C0B0FF;">Open workspace <span style="font-size:15px;">→</span></div>
        </button>
      </div>

      <div id="auth-shell" style="flex:none; max-width:480px; width:100%; margin:22px auto 0; display:none;">
        <form id="auth-form" style="background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:18px 18px 16px; backdrop-filter:blur(8px);">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;">
            <div>
              <div id="auth-role-eyebrow" style="font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:#FFD9A0; font-weight:700;">Secure admin access</div>
              <div id="auth-role-title" class="pm-serif" style="font-size:24px; color:#F4EFE6; margin-top:4px;">Sign in</div>
            </div>
            <button type="button" onclick="closeAuth()" style="border:none; background:transparent; color:#8A9A90; font-size:13px; cursor:pointer;">Close</button>
          </div>
          <div style="display:grid; gap:10px;">
            <input id="auth-email" type="email" autocomplete="email" placeholder="Email address" style="height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:rgba(12,16,14,.54); color:#F4EFE6; padding:0 14px;">
            <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password" style="height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.14); background:rgba(12,16,14,.54); color:#F4EFE6; padding:0 14px;">
            <button id="auth-submit" type="submit" style="height:48px; border:none; border-radius:12px; background:#D6B06F; color:#0C100E; font-weight:800; cursor:pointer;">Continue</button>
          </div>
          <div id="auth-status" style="min-height:18px; margin-top:12px; font-size:13px; color:#CFE2D7;"></div>
        </form>
      </div>
    </div>
  </section>
</div>

<script>
  let pendingRole = 'dealer';
  let nextTarget = '';

  function roleMeta(role) {
    if (role === 'team') return { accent: '#C0B0FF', eyebrow: 'Secure team access', title: 'Team Login', target: '/admin/team.html' };
    return { accent: '#FFD9A0', eyebrow: 'Secure owner access', title: 'Dealer Login', target: '/admin/owner.html' };
  }

  function openAuth(role) {
    pendingRole = role;
    const meta = roleMeta(role);
    document.getElementById('auth-shell').style.display = 'block';
    document.getElementById('auth-role-eyebrow').textContent = meta.eyebrow;
    document.getElementById('auth-role-eyebrow').style.color = meta.accent;
    document.getElementById('auth-role-title').textContent = meta.title;
    document.getElementById('auth-submit').textContent = role === 'team' ? 'Continue as Team' : 'Continue as Dealer';
    document.getElementById('auth-status').textContent = '';
    document.getElementById('auth-email').focus();
  }

  function closeAuth() {
    document.getElementById('auth-shell').style.display = 'none';
    document.getElementById('auth-status').textContent = '';
  }

  function continueAs(role) {
    if (role === 'presentation') {
      window.location.href = '/app/plotmap/';
      return;
    }
    openAuth(role);
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const accessResult = window.PMAccess && window.PMAccess.consumeAccessLinkFromUrl({ redirect: true });
    if (accessResult && !accessResult.ok) {
      window.location.href = '/admin/access-expired.html';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    nextTarget = params.get('next') || '';
    if (params.get('reason') === 'role_not_allowed') {
      document.getElementById('auth-status').textContent = 'Your account does not have access to that workspace.';
      document.getElementById('auth-shell').style.display = 'block';
    }

    if (window.PMAuth) {
      const profile = await window.PMAuth.getCurrentProfile().catch(() => null);
      if (profile && nextTarget) {
        window.location.replace(nextTarget);
        return;
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async event => {
      event.preventDefault();
      const status = document.getElementById('auth-status');
      const submit = document.getElementById('auth-submit');
      status.textContent = 'Signing in…';
      submit.disabled = true;
      try {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        await window.PMAuth.signIn(email, password);
        const profile = await window.PMAuth.getCurrentProfile();
        if (!profile) throw new Error('No admin profile found for this account.');
        const normalized = window.PMAuth.normalizeRole(profile.role);
        if (pendingRole === 'dealer' && normalized !== 'owner') {
          throw new Error('This account does not have dealer access.');
        }
        if (pendingRole === 'team' && normalized !== 'team' && normalized !== 'owner') {
          throw new Error('This account does not have team access.');
        }
        window.location.href = nextTarget || roleMeta(pendingRole).target;
      } catch (error) {
        status.textContent = error.message || 'Sign in failed.';
      } finally {
        submit.disabled = false;
      }
    });
  });
</script>

</body>
</html>
