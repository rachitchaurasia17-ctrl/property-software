<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PlotMap Admin Redirect</title>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/access-control.js"></script>
<script>
if (window.PMAccess) {
  Promise.resolve(window.PMAccess.guardPage({ roleRequired: 'team' })).then(result => {
    if (result && result.ok) window.location.replace('/admin/map-studio.html');
  });
}
</script>
<style>
  html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f7f5ef;color:#23211c;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:460px;background:#fff;border:1px solid #e6dcc8;border-radius:16px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(20,14,4,.08);}
  h1{margin:0 0 10px;font-size:26px;}
  p{margin:0;color:#6b6456;line-height:1.5;}
</style>
</head>
<body>
  <main class="card">
    <h1>Opening Map Studio</h1>
    <p>The legacy highlight editor has been retired from the public surface. Authorized users are redirected to the secure Map Studio route.</p>
  </main>
</body>
</html>
