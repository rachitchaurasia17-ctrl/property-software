<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Property Insights — PlotMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="/admin/core/plotmap-ds.css">
<script src="/config/runtime-env.js"></script>
<script src="/config/supabase-config.js"></script>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/finance-engine.js"></script>
<script src="/admin/core/command-engine.js"></script>
<script src="/admin/core/report-engine.js"></script>
<script src="/admin/core/event-tracker.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/core/overlay-store.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/plotmap-shell.js"></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'owner' });
</script>
<style>
  .pi-stat-card { background:var(--pm-surface); border:1.5px solid var(--pm-hairline-2); border-radius:20px; padding:22px; box-shadow:var(--pm-shadow-card); }
  .pi-stat-card .lbl { font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--pm-ink-soft); }
  .pi-stat-card .val { font-family:var(--pm-font-display); font-size:44px; font-weight:500; line-height:1; margin-top:6px; }
  .pi-stat-card .sub { font-size:12.5px; color:var(--pm-ink-soft); margin-top:8px; }
  .pi-item { display:flex; align-items:center; gap:16px; padding:14px 0; border-bottom:1px solid var(--pm-hairline); }
  .pi-item:last-child { border-bottom:none; }
</style>
</head>
<body class="pm-body pm-app-bg">
<script>
document.addEventListener('DOMContentLoaded', () => {
  const crm = window.CRM;
  const data = crm && crm.getCRM ? crm.getCRM() : {};
  const props = data.properties || [];
  const esc = window.PMShell.esc;

  const mount = window.PMShell.mount({
    variant: 'owner',
    active: 'home',
    section: { icon: 'ph-chart-line-up', name: 'Property Insights' }
  });

  const pinForProperty = (id) => {
    if (!window.PMOverlayStore) return null;
    return window.PMOverlayStore.customItems().find(it => it && it.kind === 'pin' && it.propertyId === id && !it.deleted) || null;
  };

  const available = props.filter(p => p.internalStatus === 'Available');
  const onHold = props.filter(p => p.internalStatus === 'On Hold');
  const sold = props.filter(p => p.internalStatus === 'Sold');

  const hasPhoto = (p) => Array.isArray(p.photos) && p.photos.some(s => /^https?:\/\//i.test(String(s || '')));
  const onMap = (p) => !!pinForProperty(p.id) || !!p.masterMapId || (Array.isArray(p.plotAt) && p.plotAt.length === 2);
  const hasSector = (p) => !!p.sectorMapId;
  const isVisible = (p) => p.clientVisible !== false;
  const readyProps = props.filter(p => isVisible(p) && hasPhoto(p) && (onMap(p) || hasSector(p)));
  const needsWork = props.length - readyProps.length;
  const health = props.length ? Math.round((readyProps.length / props.length) * 100) : 0;

  mount.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
      <div>
        <h1 style="font-family:var(--pm-font-display);font-weight:500;font-size:32px;color:var(--pm-ink);margin:0 0 6px;">Property Insights</h1>
        <p style="font-size:16px;color:var(--pm-ink-soft);margin:0;">Portfolio readiness, presentation attention, and listing quality.</p>
      </div>
      <a class="pm-btn pm-btn-violet" href="/admin/properties.html">
        <i class="ph ph-buildings"></i> Manage Properties
      </a>
    </div>

    <!-- Portfolio Readiness KPIs -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;">
      <div class="pi-stat-card">
        <div class="lbl">Ready to Show</div>
        <div class="val" style="color:var(--pm-emerald);">${readyProps.length}</div>
        <div class="sub">Client-safe with photo &amp; map location</div>
      </div>
      <div class="pi-stat-card">
        <div class="lbl">Needs Work</div>
        <div class="val" style="color:var(--pm-gold-dark);">${needsWork}</div>
        <div class="sub">Missing photo, map pin, or sector proof</div>
      </div>
      <div class="pi-stat-card">
        <div class="lbl">Portfolio Health</div>
        <div class="val" style="color:${health >= 70 ? 'var(--pm-emerald)' : health >= 40 ? 'var(--pm-gold-dark)' : 'var(--pm-orange)'};">${health}%</div>
        <div class="sub">Share of total listings ready to show</div>
      </div>
    </div>

    <!-- Inventory Status Bar -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px;">
      <div class="pm-card" style="padding:16px 20px;">
        <div style="font-size:12px;font-weight:800;color:var(--pm-ink-soft);text-transform:uppercase;">Listed</div>
        <div style="font-size:28px;font-family:var(--pm-font-display);font-weight:500;color:var(--pm-ink);margin-top:4px;">${props.length}</div>
      </div>
      <div class="pm-card" style="padding:16px 20px;">
        <div style="font-size:12px;font-weight:800;color:var(--pm-ink-soft);text-transform:uppercase;">Available</div>
        <div style="font-size:28px;font-family:var(--pm-font-display);font-weight:500;color:var(--pm-emerald);margin-top:4px;">${available.length}</div>
      </div>
      <div class="pm-card" style="padding:16px 20px;">
        <div style="font-size:12px;font-weight:800;color:var(--pm-ink-soft);text-transform:uppercase;">On Hold</div>
        <div style="font-size:28px;font-family:var(--pm-font-display);font-weight:500;color:var(--pm-gold-dark);margin-top:4px;">${onHold.length}</div>
      </div>
      <div class="pm-card" style="padding:16px 20px;">
        <div style="font-size:12px;font-weight:800;color:var(--pm-ink-soft);text-transform:uppercase;">Sold</div>
        <div style="font-size:28px;font-family:var(--pm-font-display);font-weight:500;color:var(--pm-blue);margin-top:4px;">${sold.length}</div>
      </div>
    </div>

    <!-- Getting Attention vs Action Required Grid -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-bottom:28px;">
      <!-- Getting Attention -->
      <div class="pm-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);">
        <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);margin-bottom:4px;">Getting the Most Attention</div>
        <div style="font-size:13.5px;color:var(--pm-ink-soft);margin-bottom:18px;">Properties clients explore most in Client Presentation</div>
        <div id="pi-attention-list"></div>
      </div>

      <!-- Action Required -->
      <div class="pm-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);">
        <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);margin-bottom:4px;">Action Required</div>
        <div style="font-size:13.5px;color:var(--pm-ink-soft);margin-bottom:18px;">Fix these to make listings ready for client presentation</div>
        <div id="pi-issues-list"></div>
      </div>
    </div>

    <!-- Area Distribution & Type Distribution -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;">
      <div class="pm-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);">
        <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);margin-bottom:4px;">Inventory by Area</div>
        <div style="font-size:13.5px;color:var(--pm-ink-soft);margin-bottom:18px;">Distribution of properties across areas</div>
        <div id="pi-area-dist"></div>
      </div>

      <div class="pm-card" style="border-radius:24px;padding:24px;background:var(--pm-surface);border:1.5px solid var(--pm-hairline-2);">
        <div style="font-family:var(--pm-font-display);font-size:22px;font-weight:500;color:var(--pm-ink);margin-bottom:4px;">Inventory by Type</div>
        <div style="font-size:13.5px;color:var(--pm-ink-soft);margin-bottom:18px;">Property type breakdown</div>
        <div id="pi-type-dist"></div>
      </div>
    </div>
  `;

  // --- Render Attention List ---
  const pstats = crm.computePresentationStats ? crm.computePresentationStats() : { perProperty: {} };
  const statOf = (p) => (pstats.perProperty && pstats.perProperty[p.id]) || { views: 0, shares: 0, lastAt: 0 };
  const viewsOf = (p) => statOf(p).views;
  const sortedProps = [...props].sort((a, b) => viewsOf(b) - viewsOf(a));
  const attnEl = document.getElementById('pi-attention-list');

  if (sortedProps.length === 0) {
    attnEl.innerHTML = '<div class="pm-empty" style="padding:24px;"><div class="pm-empty-desc">No properties added yet.</div></div>';
  } else if (sortedProps.every(p => viewsOf(p) === 0)) {
    attnEl.innerHTML = '<div class="pm-empty" style="padding:24px;"><div class="pm-empty-title">No presentation views recorded</div><div class="pm-empty-desc">When you walk clients through PlotMap, property attention shows up here.</div></div>';
  } else {
    const top = sortedProps[0];
    attnEl.innerHTML = sortedProps.slice(0, 5).map(p => {
      const s = statOf(p);
      const maxViews = viewsOf(top) || 1;
      const pct = Math.round((s.views / maxViews) * 100);
      return `
        <div class="pi-item">
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;color:var(--pm-ink);">${esc(p.title || p.name || 'Unnamed')}</div>
            <div style="font-size:13px;color:var(--pm-ink-soft);margin-top:2px;">${esc(p.area || '—')} ${s.shares ? '· ' + s.shares + ' shares' : ''}</div>
          </div>
          <div style="width:100px;">
            <div style="height:6px;background:var(--pm-surface-alt);border-radius:999px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:var(--pm-emerald);border-radius:999px;"></div>
            </div>
          </div>
          <span style="font-size:13.5px;font-weight:700;color:var(--pm-emerald);width:56px;text-align:right;">${s.views} v</span>
        </div>`;
    }).join('');
  }

  // --- Render Issues List ---
  const issuesEl = document.getElementById('pi-issues-list');
  const issues = [];
  props.forEach(p => {
    const nm = p.title || p.name || 'Unnamed';
    if (!hasPhoto(p)) issues.push({ title: nm, issue: 'Needs a photo', icon: 'ph-camera' });
    if (!onMap(p)) issues.push({ title: nm, issue: 'Not on a map yet', icon: 'ph-map-pin' });
    if (!hasSector(p)) issues.push({ title: nm, issue: 'Needs sector proof', icon: 'ph-shield-check' });
  });

  if (issues.length === 0) {
    issuesEl.innerHTML = '<div class="pm-empty" style="padding:24px;"><div class="pm-empty-title">All listings complete</div><div class="pm-empty-desc">No quality issues found across your portfolio.</div></div>';
  } else {
    issuesEl.innerHTML = issues.slice(0, 6).map(i => `
      <div class="pi-item">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--pm-surface-gold);color:var(--pm-gold-dark);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;">
          <i class="${i.icon}"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14.5px;font-weight:700;color:var(--pm-ink);">${esc(i.title)}</div>
          <div style="font-size:12.5px;color:var(--pm-orange);font-weight:600;">${esc(i.issue)}</div>
        </div>
      </div>
    `).join('');
  }

  // --- Render Area Distribution ---
  const areaDistEl = document.getElementById('pi-area-dist');
  const areas = {};
  props.forEach(p => { if (p.area) areas[p.area] = (areas[p.area] || 0) + 1; });
  const sortedAreas = Object.entries(areas).sort((a, b) => b[1] - a[1]);
  const maxArea = sortedAreas.length ? sortedAreas[0][1] : 1;

  areaDistEl.innerHTML = sortedAreas.length === 0
    ? '<div class="pm-empty" style="padding:20px;"><div class="pm-empty-desc">No area data available.</div></div>'
    : sortedAreas.slice(0, 6).map(([name, count]) => {
        const pct = Math.round((count / maxArea) * 100);
        return `
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:14px;font-weight:700;color:var(--pm-ink);">${esc(name)}</span>
              <span style="font-size:13px;font-weight:700;color:var(--pm-violet-deep);">${count}</span>
            </div>
            <div style="height:6px;background:var(--pm-surface-alt);border-radius:999px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:var(--pm-violet-deep);border-radius:999px;"></div>
            </div>
          </div>`;
      }).join('');

  // --- Render Type Distribution ---
  const typeDistEl = document.getElementById('pi-type-dist');
  const types = {};
  props.forEach(p => { const t = p.propertyType || p.type || 'Other'; types[t] = (types[t] || 0) + 1; });
  const sortedTypes = Object.entries(types).sort((a, b) => b[1] - a[1]);
  const maxType = sortedTypes.length ? sortedTypes[0][1] : 1;

  typeDistEl.innerHTML = sortedTypes.length === 0
    ? '<div class="pm-empty" style="padding:20px;"><div class="pm-empty-desc">No property type data.</div></div>'
    : sortedTypes.map(([name, count]) => {
        const pct = Math.round((count / maxType) * 100);
        return `
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
              <span style="font-size:14px;font-weight:700;color:var(--pm-ink);">${esc(name)}</span>
              <span style="font-size:13px;font-weight:700;color:var(--pm-emerald);">${count}</span>
            </div>
            <div style="height:6px;background:var(--pm-surface-alt);border-radius:999px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:var(--pm-emerald);border-radius:999px;"></div>
            </div>
          </div>`;
      }).join('');
});
</script>
</body>
</html>
