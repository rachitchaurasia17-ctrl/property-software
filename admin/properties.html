<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Plots — PlotMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="/admin/core/plotmap-ds.css">
<!-- Data + platform contracts preserved exactly. -->
<script src="/config/runtime-env.js"></script>
<script src="/config/supabase-config.js"></script>
<script src="/admin/core/auth.js"></script>
<script src="/admin/crm-data.js"></script>
<script src="/admin/core/data-adapter.js"></script>
<script src="/admin/core/sync-queue.js"></script>
<script src="/admin/core/event-tracker.js"></script>
<script src="/admin/core/access-control.js"></script>
<script src="/admin/crm-store.js"></script>
<script src="/admin/core/overlay-store.js"></script>
<script src="/admin/core/saas-foundation.js"></script>
<script src="/admin/core/supabase-sync.js"></script>
<script src="/admin/core/plotmap-shell.js"></script>
<script>window.PM_CLIENT_LINKS_ENABLED = true;</script>
<script src="/admin/core/plotmap-client-links.js"></script>
<script src="/app/plotmap/map-registry.js" defer></script>
<script>
if (window.PMAccess) window.PMAccess.guardPage({ roleRequired: 'team' });
</script>
<style>
  .mp-stat { border-radius:20px; padding:24px 26px; }
  .mp-stat .k { font-size:14px; font-weight:700; }
  .mp-stat .v { font-family:var(--pm-font-display); font-weight:500; font-size:44px; line-height:1; margin-top:8px; }
  .mp-card { background:var(--pm-surface-alt); border:1px solid var(--pm-hairline-2); border-radius:18px; overflow:hidden; box-shadow:0 1px 2px rgba(30,28,22,.03),0 14px 34px -26px rgba(30,28,22,.6); transition:border-color var(--pm-hover-ms) ease; }
  .mp-card:hover { border-color:#ecd0bf; }
  .mp-photo { height:150px; position:relative; background:#e7e0d2; }
  .mp-photo .ph { position:absolute; inset:0; background-size:cover; background-position:center; }
  .mp-chip { font-size:13px; font-weight:600; color:#4c463d; background:#f7e7c6; border-radius:9px; padding:5px 11px; display:inline-flex; align-items:center; gap:5px; }
  .mp-tag { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:800; padding:5px 11px; border-radius:999px; }
  .mp-need { display:flex; align-items:center; gap:16px; padding:18px 22px; border:1px solid #f2ddd2; background:#fdf3ee; border-radius:16px; }
  .mp-menu-btn { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:800; padding:8px 12px; border-radius:10px; background:var(--pm-surface-violet); color:var(--pm-ink-2); }
  .mp-menu-btn:hover { background:#e7defc; }
  /* Add/edit form dialog + client-link drawer reuse DS .pm-overlay/.pm-drawer */
  .mp-form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:900px){ .mp-form-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body class="pm-body pm-app-bg">
<script>
document.addEventListener('DOMContentLoaded', () => {
  const crm = window.CRM;
  const esc = window.PMShell.esc;
  // Properties is a Team Workspace tool (role split preserved) — team nav.
  const mount = window.PMShell.mount({ variant:'team', active:'plots', section:{ icon:'ph-buildings', name:'My Plots' } });

  // ---------- helpers preserved from prior implementation ----------
  const liveProps = () => (crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM()).properties.filter(p => p.internalStatus !== 'Archived');
  const scoped = () => (crm.getScopedCRM ? crm.getScopedCRM() : crm.getCRM());
  const registryMaps = () => (window.PM_MAP_REGISTRY && Array.isArray(window.PM_MAP_REGISTRY.maps)) ? window.PM_MAP_REGISTRY.maps : [];
  const normalize = (v) => String(v || '').trim().toLowerCase();
  const masterMapForArea = (area) => registryMaps().find(m => m.type === 'masterplan' && normalize(m.area) === normalize(area) && m.status === 'active') || null;
  const sectorMapForProperty = (prop) => {
    if (!prop) return null;
    if (prop.sectorMapId) { const explicit = registryMaps().find(m => m.id === prop.sectorMapId); if (explicit) return explicit; }
    const sectorText = normalize(prop.sector || prop.block);
    return registryMaps().find(m => m.type === 'sector' && m.status === 'active' && (
      normalize(m.area) === normalize(prop.area) || normalize(m.title) === sectorText || normalize(m.block) === sectorText ||
      normalize(m.sectorOrBlockName) === sectorText || normalize(m.matchKey) === sectorText.replace(/\s+/g, '-')
    )) || null;
  };
  const clientHrefForProperty = (id, view) => {
    if (window.PMFoundation && typeof window.PMFoundation.buildPresentationShareUrl === 'function') return window.PMFoundation.buildPresentationShareUrl({ propertyId: id, view: view || 'detail' });
    const href = new URL('/app/plotmap/', window.location.origin); href.searchParams.set('property', id); if (view) href.searchParams.set('view', view); return href.toString();
  };
  const mapStudioHrefForProperty = (prop) => {
    const href = new URL('/admin/map-studio.html', window.location.origin); const sectorMap = sectorMapForProperty(prop);
    if (sectorMap) href.searchParams.set('map', sectorMap.id); href.searchParams.set('tool', 'pin'); href.searchParams.set('property', prop.id); return href.toString();
  };
  const pinIndex = () => { const map = new Map(); if (!window.PMOverlayStore) return map; window.PMOverlayStore.customItems().forEach(it => { if (it && it.kind === 'pin' && it.propertyId && !it.deleted && !map.has(it.propertyId)) map.set(it.propertyId, it); }); return map; };
  const money = n => { n = Number(n||0); if(!n) return 'Set price'; if(n>=1e7) return '₹'+(n/1e7).toFixed(n%1e7?2:0)+' Cr'; if(n>=1e5) return '₹'+(n/1e5).toFixed(n%1e5?1:0)+' L'; return '₹'+n.toLocaleString('en-IN'); };
  const photosOf = (p) => window.PMFoundation ? window.PMFoundation.hydratePropertyPhotos(p) : (Array.isArray(p.photos) ? p.photos : []);
  const clientPhotoChoices = (p) => {
    const choices = [];
    (Array.isArray(p.photos) ? p.photos : []).slice(0, 8).forEach((url, index) => {
      if (/^https:\/\//i.test(String(url || ''))) choices.push({ ref:'external:' + index, label:'Photo ' + (choices.length + 1) });
    });
    (Array.isArray(p.photoStorage) ? p.photoStorage : []).slice(0, 8).forEach((item, index) => {
      if (item && item.kind === 'storage' && item.path) choices.push({ ref:'storage:' + index, label:'Stored photo ' + (choices.length + 1) });
    });
    return choices.slice(0, 8);
  };
  const isReady = (p) => { const ph = photosOf(p); return p.clientVisible !== false && ph.length > 0 && (pinIndex().has(p.id) || !!sectorMapForProperty(p)); };

  // ---------- window-scoped actions preserved ----------
  window.editProp = (id) => { const p = liveProps().find(x => x.id === id); if (p) openForm(p); };
  window.archiveProp = async (id) => { if (!(await window.PMShell.confirm({ title:'Archive this plot?', body:'It disappears from the client presentation and this list, but is not deleted.', okText:'Archive', danger:true }))) return; crm.archiveProperty(id); render(); };
  window.markSold = (id) => { crm.updateProperty(id, { internalStatus: 'Sold' }); render(); window.PMShell.toast('Marked sold', 'ok'); };
  window.toggleVisible = (id) => { const p = liveProps().find(x => x.id === id); if (!p) return; crm.updateProperty(id, { clientVisible: p.clientVisible === false }); render(); };
  window.unpinProp = async (id) => { const pin = pinIndex().get(id); if (!pin) return; if (!(await window.PMShell.confirm({ title:'Remove from map?', body:"The property's marker is removed; the property itself stays in your inventory.", okText:'Remove', danger:true }))) return; window.PMOverlayStore.remove(pin.id); render(); };
  window.placeProp = (id) => { const prop = liveProps().find(x => x.id === id); if (prop) window.location.href = mapStudioHrefForProperty(prop); };
  window.viewPropOnMap = (id) => window.open(clientHrefForProperty(id, 'map'), '_blank', 'noopener');
  window.editPrice = (id) => { const p = liveProps().find(x => x.id === id); if (!p) return; const cur = p.price ? String(p.price) : ''; const v = window.prompt('Price for "' + (p.title || 'plot') + '" (₹, numbers only):', cur); if (v === null) return; const n = Number(String(v).replace(/[^\d.]/g, '')); crm.updateProperty(id, { price: isFinite(n) ? n : null }); render(); window.PMShell.toast('Price updated', 'ok'); };

  // ---------- page markup (design My Plots), injected into the shell ----------
  const clients = () => (scoped().clients || []);
  mount.innerHTML = `
  <div class="pm-shell-page" style="max-width:1120px">
    <div class="pm-spread" style="align-items:flex-end;flex-wrap:wrap;gap:20px" class="pm-anim-rise">
      <div><h1 class="pm-h1" style="font-size:34px">My Plots</h1><p class="pm-lead" style="margin-top:8px">Everything you have to sell — and what's ready to show a customer.</p></div>
      <button class="pm-btn pm-btn-primary pm-btn-lg" id="btn-toggle-add"><i class="ph-bold ph-plus"></i>Add a plot</button>
    </div>

    <div class="pm-row" style="gap:14px;margin-top:22px;position:relative;z-index:20">
      <div style="position:relative">
        <button class="pm-filter-pill" id="city-filter-btn" style="height:auto;padding:10px 16px">
          <i class="ph-fill ph-map-pin" style="color:#d95d1e"></i>
          <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.1"><span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pm-ink-soft)">Showing</span><span style="font-size:16.5px;font-weight:800;color:var(--pm-ink)" id="city-filter-label">All cities</span></span>
          <i class="ph ph-caret-down" style="color:var(--pm-ink-soft)"></i>
        </button>
        <div id="city-menu" style="display:none;position:absolute;top:calc(100% + 10px);left:0;width:440px;max-width:80vw;background:var(--pm-surface-alt);border:1px solid var(--pm-hairline-2);border-radius:18px;box-shadow:var(--pm-shadow-pop);padding:12px;z-index:40"></div>
      </div>
    </div>

    <div class="pm-grid" style="grid-template-columns:1.2fr 1fr 1fr;margin-top:20px">
      <div class="mp-stat" style="background:#ffc93c;background-image:linear-gradient(135deg,#ffdc7a,#f4ae14);color:#1f1a12"><div class="k" style="color:#8a6a14">Value of stock</div><div class="v" id="mp-value">—</div></div>
      <div class="mp-stat" style="background:#ffe6cf;border:1px solid #f8cba6"><div class="k" style="color:var(--pm-ink-muted)">Ready to show</div><div class="v" id="mp-ready" style="color:#d95d1e">0</div></div>
      <div class="mp-stat pm-card-violet"><div class="k" style="color:var(--pm-ink-muted)">Need a photo</div><div class="v" id="mp-need" style="color:#b5322a">0</div></div>
    </div>

    <div class="pm-eyebrow" style="color:var(--pm-ink-soft);margin:30px 0 14px">Ready to show</div>
    <div id="mp-ready-grid" class="pm-grid" style="grid-template-columns:repeat(auto-fill,minmax(310px,1fr))"></div>
    <div id="mp-needwork-wrap" style="display:none">
      <div class="pm-eyebrow" style="color:var(--pm-ink-soft);margin:34px 0 14px">Need work before you can show them</div>
      <div id="mp-needwork" class="pm-stack" style="gap:12px"></div>
    </div>
  </div>

  <!-- Add / edit plot — DS dialog. INPUT IDS PRESERVED for PMPhotoManager + submit. -->
  <div class="pm-overlay" id="add-prop">
    <div class="pm-dialog" style="max-width:760px;max-height:90vh;overflow:auto" role="dialog" aria-modal="true">
      <div class="pm-dialog-head"><h3 class="pm-sheet-title" id="form-title">Add a plot</h3><button class="pm-dialog-close" type="button" id="form-cancel">✕</button></div>
      <form id="add-prop-form">
        <input type="hidden" id="p-editing" value="">
        <div class="mp-form-grid">
          <div class="pm-field"><label class="pm-label">Title</label><input class="pm-input" type="text" id="p-title" required placeholder="Property name"></div>
          <div class="pm-field"><label class="pm-label">Area (masterplan)</label><input class="pm-input" type="text" id="p-area" required placeholder="e.g. Aerocity" list="area-options"><datalist id="area-options"></datalist></div>
          <div class="pm-field"><label class="pm-label">Sector / Block</label><input class="pm-input" type="text" id="p-sector" placeholder="e.g. Sector 82"></div>
          <div class="pm-field"><label class="pm-label">Plot Number</label><input class="pm-input" type="text" id="p-plot" placeholder="e.g. 128"></div>
          <div class="pm-field"><label class="pm-label">Type</label><select class="pm-select" id="p-type"><option>Plot</option><option>Flat</option><option>Floor</option><option>SCO</option><option>Villa</option><option>Booth</option><option>Other</option></select></div>
          <div class="pm-field"><label class="pm-label">Size</label><input class="pm-input" type="text" id="p-size" placeholder="e.g. 200 sq.yd."></div>
          <div class="pm-field"><label class="pm-label">Facing</label><input class="pm-input" type="text" id="p-facing" placeholder="e.g. Park facing"></div>
          <div class="pm-field"><label class="pm-label">Status</label><select class="pm-select" id="p-status"><option>Available</option><option>On Hold</option><option>Internal Only</option></select></div>
          <div class="pm-field"><label class="pm-label">Detailed Map</label><select class="pm-select" id="p-sectormap"><option value="">— none —</option></select></div>
          <div class="pm-field"><label class="pm-label">Price (₹, internal)</label><input class="pm-input" type="text" id="p-price" inputmode="numeric" placeholder="e.g. 4500000"></div>
        </div>
        <div class="pm-alert pm-alert-warn" style="margin-top:14px"><i class="ph-fill ph-lock-simple"></i><span>Only client-safe information is shown to clients. Price, seller and internal notes never appear in the Client Presentation.</span></div>
        <div class="pm-field" style="margin-top:12px"><label class="pm-label">Short description (shown to clients)</label><input class="pm-input" type="text" id="p-desc" maxlength="240" placeholder="e.g. Corner plot near main market"></div>
        <div class="pm-field" style="margin-top:12px">
          <label class="pm-label">Photo links (comma separated)</label>
          <input class="pm-input" type="text" id="p-photos" placeholder="https://…jpg, https://…jpg">
          <div class="pm-meta" style="margin-top:6px" id="p-photo-storage-note">Paste image links — they show in the presentation right away. Device uploads turn on once your storage is enabled.</div>
          <div id="p-photo-manager" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px"></div>
          <div id="p-photo-upload" style="display:none;margin-top:10px">
            <input type="file" id="p-photo-file" accept="image/jpeg,image/png,image/webp" multiple>
            <button type="button" class="pm-btn pm-btn-ghost pm-btn-sm" id="p-photo-upload-btn" style="margin-left:8px">Upload to storage</button>
            <div id="p-photo-selected" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
            <div id="p-photo-upload-status" class="pm-meta" style="margin-top:6px"></div>
          </div>
        </div>
        <label class="pm-row" style="gap:12px;margin-top:14px;padding:13px 15px;border:1px solid var(--pm-hairline);border-radius:14px;background:var(--pm-surface);cursor:pointer">
          <input type="checkbox" id="p-visible" checked style="width:18px;height:18px;flex:none">
          <span><strong style="display:block">Show this property to clients</strong><span class="pm-meta">On = visible in the Client Presentation. Off = kept private to your team.</span></span>
        </label>
        <div class="pm-row" style="gap:10px;margin-top:16px">
          <button type="submit" class="pm-btn pm-btn-primary" id="form-submit">Save plot</button>
          <button type="button" class="pm-btn pm-btn-ghost" id="form-cancel-2">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Private Client Link drawer (entry points + UI states; backend pending). -->
  <div class="pm-drawer" id="cl-drawer" aria-hidden="true">
    <div class="pm-row" style="justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--pm-hairline)">
      <div><div class="pm-eyebrow pm-eyebrow-violet">Private client link</div><div class="pm-sheet-title" id="cl-plot" style="margin-top:4px">Send a private link</div></div>
      <button class="pm-dialog-close" id="cl-close" type="button">✕</button>
    </div>
    <div class="pm-scroll" style="flex:1;min-height:0;overflow-y:auto;padding:22px" id="cl-body"></div>
  </div>
  <div class="pm-overlay" id="cl-scrim" style="z-index:59"></div>
  <div id="client-links" style="position:absolute"></div>`;

  // ---------- map options (area datalist + sector select) ----------
  function fillMapOptions() {
    const reg = window.PM_MAP_REGISTRY;
    if (!reg || !Array.isArray(reg.maps)) { setTimeout(fillMapOptions, 300); return; }
    const areas = [...new Set(reg.maps.filter(m => m.type === 'masterplan' && m.area).map(m => m.area))];
    document.getElementById('area-options').innerHTML = areas.map(a => '<option value="' + esc(a) + '">').join('');
    const sectors = reg.maps.filter(m => m.type === 'sector' && m.hasOriginalMap);
    document.getElementById('p-sectormap').innerHTML = '<option value="">— none —</option>' + sectors.map(m => '<option value="' + esc(m.id) + '">' + esc(m.displayName || m.title) + '</option>').join('');
  }
  fillMapOptions();

  // ---------- add / edit form (dialog) ----------
  const formCard = document.getElementById('add-prop');
  function openForm(prop) {
    document.getElementById('p-editing').value = prop ? prop.id : '';
    document.getElementById('form-title').textContent = prop ? 'Edit plot' : 'Add a plot';
    document.getElementById('form-submit').textContent = prop ? 'Save changes' : 'Save plot';
    const set = (id, v) => { document.getElementById(id).value = v == null ? '' : v; };
    set('p-title', prop && prop.title); set('p-area', prop && prop.area); set('p-sector', prop && (prop.sector || prop.block));
    set('p-plot', prop && prop.plotNumber); document.getElementById('p-type').value = prop ? (prop.type || 'Plot') : 'Plot';
    set('p-size', prop && prop.size); set('p-facing', prop && prop.facing);
    document.getElementById('p-status').value = prop && ['Available','On Hold','Internal Only'].includes(prop.internalStatus) ? prop.internalStatus : 'Available';
    set('p-sectormap', prop && prop.sectorMapId); set('p-desc', prop && prop.description); set('p-price', prop && prop.price);
    set('p-photos', prop && Array.isArray(prop.photos) ? prop.photos.join(', ') : '');
    document.getElementById('p-visible').checked = prop ? prop.clientVisible !== false : true;
    if (window.PMPhotoManager) window.PMPhotoManager.reset(prop);
    formCard.classList.add('is-open');
  }
  function closeForm() { formCard.classList.remove('is-open'); document.getElementById('add-prop-form').reset(); document.getElementById('p-editing').value = ''; }
  document.getElementById('btn-toggle-add').addEventListener('click', () => { openForm(null); if (window.PMEventTracker) window.PMEventTracker.trackProductEvent('property_add_clicked', {}); });
  document.getElementById('form-cancel').addEventListener('click', closeForm);
  document.getElementById('form-cancel-2').addEventListener('click', closeForm);
  formCard.addEventListener('click', (e) => { if (e.target === formCard) closeForm(); });

  document.getElementById('add-prop-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const editingId = document.getElementById('p-editing').value;
    const photoData = window.PMPhotoManager ? window.PMPhotoManager.collect()
      : (function () { const urls = document.getElementById('p-photos').value.split(',').map(s => s.trim()).filter(s => /^https?:\/\//i.test(s)).slice(0, 8); return { photos: urls, photoStorage: urls.map((url, i) => ({ id:'photo-'+i, kind:'external', publicUrl:url })) }; })();
    const priceRaw = document.getElementById('p-price').value.replace(/[^\d.]/g, '');
    const fields = {
      title: v('p-title'), area: v('p-area'), sector: v('p-sector'), block: v('p-sector'), plotNumber: v('p-plot'),
      type: document.getElementById('p-type').value, propertyType: document.getElementById('p-type').value,
      size: v('p-size'), facing: v('p-facing'), internalStatus: document.getElementById('p-status').value,
      sectorMapId: document.getElementById('p-sectormap').value || null,
      masterMapId: (masterMapForArea(v('p-area')) || {}).id || null,
      description: v('p-desc'), price: priceRaw ? Number(priceRaw) : null,
      photos: photoData.photos, photoStorage: photoData.photoStorage, clientVisible: document.getElementById('p-visible').checked
    };
    if (editingId) crm.updateProperty(editingId, fields);
    else {
      if (window.PMFoundation) { const limit = window.PMFoundation.checkPlanLimit('properties', liveProps().length); if (!limit.ok) { window.PMShell.toast(limit.message, 'warn'); return; } }
      crm.addProperty(fields); if (window.PMEventTracker) window.PMEventTracker.trackProductEvent('property_added', {});
    }
    closeForm(); render(); window.PMShell.toast('Plot saved', 'ok');
  });
  function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  // ---------- city filter ----------
  let cityFilter = 'All';
  function cityCounts() { const m = {}; liveProps().forEach(p => { const c = p.area || p.city || 'Unassigned'; m[c] = (m[c] || 0) + 1; }); return m; }
  function renderCityMenu() {
    const counts = cityCounts(); const menu = document.getElementById('city-menu');
    const entries = [['All', liveProps().length]].concat(Object.keys(counts).sort().map(c => [c, counts[c]]));
    menu.innerHTML = '<div class="pm-grid" style="grid-template-columns:1fr 1fr;gap:6px">' + entries.map(([c, n]) =>
      `<button class="pm-spread" data-city="${esc(c)}" style="padding:10px 12px;border-radius:11px;${c===cityFilter?'background:#f4ecdd':''}">
        <span class="pm-row" style="gap:9px"><i class="ph-fill ph-map-pin-area" style="font-size:16px;color:#d95d1e"></i>${esc(c === 'All' ? 'All cities' : c)}</span>
        <span class="pm-badge pm-badge-neutral">${n}</span></button>`).join('') + '</div>';
    menu.querySelectorAll('[data-city]').forEach(b => b.addEventListener('click', () => { cityFilter = b.getAttribute('data-city'); document.getElementById('city-filter-label').textContent = cityFilter === 'All' ? 'All cities' : cityFilter; menu.style.display = 'none'; render(); }));
  }
  document.getElementById('city-filter-btn').addEventListener('click', (e) => { e.stopPropagation(); const m = document.getElementById('city-menu'); m.style.display = m.style.display === 'none' ? 'block' : 'none'; renderCityMenu(); });
  document.addEventListener('click', (e) => { const m = document.getElementById('city-menu'); if (m && !m.contains(e.target) && e.target.id !== 'city-filter-btn') m.style.display = 'none'; });

  // ---------- render My Plots ----------
  function inCity(p) { return cityFilter === 'All' || (p.area || p.city) === cityFilter; }
  function render() {
    const all = liveProps().filter(inCity);
    const ready = all.filter(isReady);

// ── Property photo workflow (URL links + gated Storage upload) — preserved. ──
window.PMPhotoManager = (function () {
  const MAX_BYTES = 5 * 1024 * 1024;

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
  function urlPhotos() { return ($('p-photos').value || '').split(',').map(s => s.trim()).filter(s => /^https?:\/\//i.test(s)); }
  function fileLabel(path) { return String(path).split('/').pop(); }
  function renderManager() {

    urlPhotos().forEach((url, i) => chips.push('<span class="pm-badge pm-badge-neutral" style="gap:8px">' + '<span style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(fileLabel(url)) + '</span>' + '<button type="button" data-rm-url="' + i + '" title="Remove" style="border:none;background:transparent;cursor:pointer;color:#b0532c;font-weight:800">✕</button></span>'));
    storagePaths.forEach((p, i) => chips.push('<span class="pm-badge pm-badge-violet" style="gap:8px"><span style="font-size:11px;font-weight:700">stored</span>' + '<span style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(fileLabel(p)) + '</span>' + '<button type="button" data-rm-store="' + i + '" title="Remove" style="border:none;background:transparent;cursor:pointer;color:#b0532c;font-weight:800">✕</button></span>'));
    host.innerHTML = chips.length ? chips.join('') : '<span class="pm-meta">No photos yet.</span>';
    host.querySelectorAll('[data-rm-url]').forEach(btn => btn.addEventListener('click', () => { const list = urlPhotos(); list.splice(Number(btn.getAttribute('data-rm-url')), 1); $('p-photos').value = list.join(', '); renderManager(); }));
    host.querySelectorAll('[data-rm-store]').forEach(btn => btn.addEventListener('click', () => { storagePaths.splice(Number(btn.getAttribute('data-rm-store')), 1); renderManager(); }));
  }
  function reset(prop) { storagePaths = (prop && Array.isArray(prop.photoStorage)) ? prop.photoStorage.filter(e => e && e.kind === 'storage' && e.path).map(e => e.path) : []; const sel = $('p-photo-selected'); if (sel) sel.innerHTML = ''; const st = $('p-photo-upload-status'); if (st) st.textContent = ''; renderManager(); }
  function collect() { const urls = urlPhotos().slice(0, 8); const photoStorage = [...urls.map((url, i) => ({ id:'photo-ext-'+i, kind:'external', publicUrl:url })), ...storagePaths.map((path, i) => ({ id:'photo-st-'+i, kind:'storage', path:path, publicUrl:null }))]; return { photos: urls, photoStorage: photoStorage }; }
  document.addEventListener('DOMContentLoaded', () => { const links = $('p-photos'); if (links) links.addEventListener('input', renderManager); renderManager(); });
  document.addEventListener('DOMContentLoaded', () => {
    const wrap = $('p-photo-upload'); if (!wrap || !window.PMFoundation) return;
    let settings; try { settings = window.PMFoundation.getDealerSettings(); } catch (e) { return; }
    if (!settings || settings.storageEnabled !== true) return;
    wrap.style.display = 'block';
    const setStatus = (m) => { const el = $('p-photo-upload-status'); if (el) el.textContent = m; };
    const fileInput = $('p-photo-file');
    fileInput.addEventListener('change', () => { const sel = $('p-photo-selected'); sel.innerHTML = ''; [...(fileInput.files || [])].forEach(f => { const ok = OK_TYPES.includes(f.type) && f.size <= MAX_BYTES; const tag = document.createElement('span'); tag.className = 'pm-badge ' + (ok ? 'pm-badge-neutral' : 'pm-badge-rose'); tag.textContent = f.name + (ok ? '' : ' — rejected'); sel.appendChild(tag); }); });
    $('p-photo-upload-btn').addEventListener('click', async () => {
      const files = [...(fileInput.files || [])]; if (!files.length) { setStatus('Choose one or more image files first.'); return; }
      if (files.some(f => !OK_TYPES.includes(f.type) || f.size > MAX_BYTES)) { setStatus('Only JPG/PNG/WebP up to 5 MB each are allowed.'); return; }
      if (!window.PMAuth) { setStatus('Not signed in.'); return; }
      const token = await window.PMAuth.getAccessToken().catch(() => null); if (!token) { setStatus('Session expired — sign in again.'); return; }
      const bucket = settings.photoBucket || 'property-photos'; const propId = $('p-editing').value || 'draft'; let done = 0;
      for (const file of files) {
        const base = file.name.replace(/\.[^.]+$/, '') + '-' + (storagePaths.length + done + 1);
        const path = window.PMFoundation.buildPhotoObjectPath(propId, base);
        setStatus('Uploading ' + (done + 1) + '/' + files.length + ' — ' + file.name + '…');
        try {
          const res = await fetch(window.PMAuth.SUPABASE_URL + '/storage/v1/object/' + bucket + '/' + path, { method:'POST', headers:{ apikey: window.PMAuth.SUPABASE_KEY, Authorization:'Bearer '+token, 'x-upsert':'true' }, body:file });
          if (!res.ok) { const hint = (res.status === 400 || res.status === 404) ? ' Photo upload isn’t switched on for your account yet.' : (res.status === 401 || res.status === 403) ? ' You don’t have permission to upload here.' : ''; setStatus('Upload failed for ' + file.name + '.' + hint); renderManager(); return; }
          storagePaths.push(path); done++;
        } catch (err) { setStatus('Upload error (network). Your saved photos are unaffected.'); renderManager(); return; }
      }
      setStatus('Uploaded ' + done + ' photo(s) and saved them with this property.'); fileInput.value = ''; $('p-photo-selected').innerHTML = ''; renderManager();
    });
  });
  return { reset: reset, collect: collect, render: renderManager };
})();
</script>
